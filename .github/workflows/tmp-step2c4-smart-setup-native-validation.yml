name: Temporary STEP 2C.4 Smart Setup Native Validation

on:
  push:
    branches:
      - feature/factory-smart-setup-native-content-ui-20260826

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: STEP 2C.4 targeted contracts
        run: >-
          node --test
          tests/contracts/factory-smart-setup-native-content-ui.contract.test.mjs
          tests/contracts/factory-native-content-venues.contract.test.mjs
          tests/contracts/p4-1-onboarding-workspace-blueprint-wizard.contract.test.mjs
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
