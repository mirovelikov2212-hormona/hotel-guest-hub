name: Massage Sheet Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  call-massage-sheet-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Refresh massage snapshot and sync Sheet changes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing."
            exit 1
          fi

          call_endpoint() {
            local label="$1"
            local url="$2"
            local response
            local body
            local status

            echo "=== ${label} ==="
            response=$(curl -sS --max-time 75 -w "\n%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$url")

            body=$(printf '%s\n' "$response" | sed '$d')
            status=$(printf '%s\n' "$response" | tail -n1)

            printf '%s\n' "$body"

            if [ "$status" != "200" ]; then
              echo "${label} failed with HTTP ${status}."
              exit 1
            fi

            if ! printf '%s' "$body" | python3 -c \
              'import json, sys; raise SystemExit(0 if json.load(sys.stdin).get("ok") is True else 1)'; then
              echo "${label} returned HTTP 200 without ok=true."
              exit 1
            fi
          }

          call_endpoint \
            "Massage snapshot refresh" \
            "https://www.stayhub.app/api/cron/massage-snapshot-sync?hotelSlug=aquamarin"

          call_endpoint \
            "Massage Sheet sync" \
            "https://www.stayhub.app/api/cron/massage-sheet-sync?hotelSlug=aquamarin&daysAhead=21"
