name: Massage External Snapshot Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: massage-external-snapshot-sync-production
  cancel-in-progress: false

jobs:
  call-massage-snapshot-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Refresh configured external massage snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing."
            exit 1
          fi

          attempt=1
          max_attempts=2

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "=== Massage external snapshot refresh (attempt ${attempt}/${max_attempts}) ==="

            if response=$(curl -sS --max-time 75 -w "\n%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://www.stayhub.app/api/cron/massage-snapshot-sync"); then
              body=$(printf '%s\n' "$response" | sed '$d')
              status=$(printf '%s\n' "$response" | tail -n1)
              printf '%s\n' "$body"

              if [ "$status" = "200" ] && printf '%s' "$body" | python3 -c \
                'import json, sys; raise SystemExit(0 if json.load(sys.stdin).get("ok") is True else 1)'; then
                exit 0
              fi
            else
              status="transport_error"
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Snapshot refresh did not complete successfully; retrying once after 5 seconds."
              sleep 5
              attempt=$((attempt + 1))
              continue
            fi

            echo "Massage external snapshot refresh failed with status ${status}."
            exit 1
          done

      - name: Detect native and external massage conflicts
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.stayhub.app/api/cron/native-massage-conflict-watch

      - name: Recover pending native massage Sheet mirrors
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.stayhub.app/api/cron/native-massage-sheet-mirror

      - name: Recover pending native massage staff projections
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.stayhub.app/api/cron/native-massage-reconcile
