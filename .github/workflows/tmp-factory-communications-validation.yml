name: Temporary Factory Communications Validation

on:
  push:
    branches:
      - feature/factory-communications-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Targeted STEP 2D communications
        run: npm run test:factory-communications
      - name: P4.1 wizard contract
        run: npm run test:p4-1
      - name: P4.12 runtime materialization contract
        run: npm run test:p4-12
      - name: Canonical contract suite
        run: npm run test:contracts
      - name: Native content suite
        run: npm run test:factory-native-content
      - name: Communications suite
        run: npm run test:factory-communications
      - name: Tenant isolation guard
        run: npm run test:tenant-isolation
      - name: Production build
        run: npm run build
