name: Temp Final Stay Preview Acceptance

on:
  push:
    branches:
      - diag/pr160-contract-isolation
    paths:
      - .github/workflows/temp-final-stay-preview-acceptance.yml

permissions:
  contents: write

jobs:
  stay-preview-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Capture exact Preview stay acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/diagnostics

          rm -f /tmp/stayhub-preview-cookies.txt
          race_http="$(curl --silent --show-error --location \
            --max-time 180 \
            --cookie-jar /tmp/stayhub-preview-cookies.txt \
            --cookie /tmp/stayhub-preview-cookies.txt \
            --write-out '%{http_code}' \
            'https://zbpwxifcsyknorpsrzbo.supabase.co/functions/v1/stayhub-preview-peak-bridge?mode=race&ticket=ffsa-20260902-ci-73e91f' \
            --output /tmp/race.json)"
          cat /tmp/race.json
          jq --arg httpStatus "$race_http" '. + {diagnosticHttpStatus: ($httpStatus | tonumber)}' /tmp/race.json > .github/diagnostics/temp-final-stay-race-result.json

          rm -f /tmp/stayhub-preview-cookies.txt
          takeover_http="$(curl --silent --show-error --location \
            --max-time 180 \
            --cookie-jar /tmp/stayhub-preview-cookies.txt \
            --cookie /tmp/stayhub-preview-cookies.txt \
            --write-out '%{http_code}' \
            'https://zbpwxifcsyknorpsrzbo.supabase.co/functions/v1/stayhub-preview-peak-bridge?mode=takeover&ticket=ffsa-20260902-ci-73e91f' \
            --output /tmp/takeover.json)"
          cat /tmp/takeover.json
          jq --arg httpStatus "$takeover_http" '. + {diagnosticHttpStatus: ($httpStatus | tonumber)}' /tmp/takeover.json > .github/diagnostics/temp-final-stay-takeover-result.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/diagnostics/temp-final-stay-race-result.json .github/diagnostics/temp-final-stay-takeover-result.json
          git commit -m 'diag: capture exact Preview stay acceptance evidence'
          git push origin HEAD:diag/pr160-contract-isolation

          jq -e '.diagnosticHttpStatus == 200 and .ok == true and .previewOnly == true and .productionLiveActivation == false and .status == "TRUE_SIMULTANEOUS_STAY_RACE_OK" and .evidenceBeforeCleanup.activeStayCount == 1 and .evidenceBeforeCleanup.deviceCount == 1 and .evidenceBeforeCleanup.conflictCount == 1 and .cleanup.deviceResidue == 0 and .cleanup.activeAfter == 0' .github/diagnostics/temp-final-stay-race-result.json
          jq -e '.diagnosticHttpStatus == 200 and .ok == true and .previewOnly == true and .productionLiveActivation == false and .status == "STALE_GUEST_A_TO_GUEST_B_TAKEOVER_OK" and .oldARequest.status == 409 and .oldARequest.body.code == "STAY_ENDED" and .liveBRequest.status == 200 and .evidenceBeforeCleanup.oldGuestRequestCount == 0 and .evidenceBeforeCleanup.liveGuestRequestCount == 1 and .cleanup.deviceResidue == 0 and .cleanup.activeAfter == 0' .github/diagnostics/temp-final-stay-takeover-result.json
