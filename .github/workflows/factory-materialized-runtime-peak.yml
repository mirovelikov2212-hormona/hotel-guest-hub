name: Factory Materialized Runtime Peak

on:
  push:
    branches:
      - feat/factory-prepare-sandbox-load-acceptance
    paths:
      - ".github/workflows/factory-materialized-runtime-peak.yml"

permissions:
  contents: read

jobs:
  mixed-peak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: https://hotel-guest-hub-git-feat-fact-347853-miroslav-velikovs-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Require Preview automation bypass
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || {
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured"
            exit 2
          }
      - name: Run clean 620-operation Preview peak
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 240 \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${PREVIEW_URL}/api/internal/capacity/mixed-peak?challenge=stayhub-materialized-peak-20260902&mode=cold" \
            -o factory-materialized-runtime-peak.json
          jq '{ok, runId, mode, bookingDate, hotels, totalOperations, wallMs, request, survey, massageUnique, massageContention, failures, contentionUnexpected}' \
            factory-materialized-runtime-peak.json
          jq -e '.ok == true and .totalOperations == 620' factory-materialized-runtime-peak.json >/dev/null
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-materialized-runtime-peak-evidence
          path: factory-materialized-runtime-peak.json
          if-no-files-found: warn
