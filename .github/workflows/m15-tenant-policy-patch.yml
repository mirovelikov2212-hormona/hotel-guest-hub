name: M15 Tenant Policy Patch

on:
  push:
    branches:
      - audit/m15-global-locales-ops-governance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m15-global-locales-ops-governance
          fetch-depth: 0
      - name: Register tenant-owned M15 tables
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/helpers/tenant-query-scanner.mjs')
          text = path.read_text()
          needle = '  staff_access_pins: "strict",\n  massage_booking_attempts: "strict",'
          replacement = '  staff_access_pins: "strict",\n  hotel_settings: "strict",\n  massage_runtime_bookings: "strict",\n  massage_booking_attempts: "strict",'
          if text.count(needle) != 1:
              raise SystemExit('tenant policy insertion anchor mismatch')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          rm .github/workflows/m15-tenant-policy-patch.yml
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "stayhub-release-bot"
          git config user.email "stayhub-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "M15: classify tenant-owned settings and native bookings"
          git push origin HEAD:audit/m15-global-locales-ops-governance
