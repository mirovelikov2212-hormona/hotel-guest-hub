name: P4.6 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/control-plane/factory/**"
      - "lib/server/factory-release-evidence.ts"
      - "lib/server/factory-sandbox-runtime-probe.ts"
      - "tests/contracts/p4-6-trusted-sandbox-evidence.contract.test.mjs"
      - "docs/P4.6-TRUSTED-SANDBOX-EVIDENCE.md"
      - ".github/workflows/factory-release-gate.yml"
      - ".github/workflows/p4-6-validation.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:p4-6
      - run: npm run test:tenant-isolation
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
