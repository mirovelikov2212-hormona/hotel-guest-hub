name: P2.6.2 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/control-plane/onboarding/production-publication/**"
      - "lib/server/factory-production-publication.ts"
      - "supabase/migrations/20260817141000_p2_6_1_readiness_lineage_fix.sql"
      - "supabase/migrations/20260817143000_p2_6_2_production_publication.sql"
      - "tests/contracts/p2-6-2-production-publication.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-p2-6-2-production-publication.json"
      - "scripts/tenant-isolation-guard.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
