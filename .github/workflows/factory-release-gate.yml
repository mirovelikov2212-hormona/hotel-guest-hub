name: Factory Release Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/contracts/p2-6-4-published-derivative-lineage.contract.test.mjs
      - run: node --test tests/contracts/p2-6-4-relational-authority-jsonb.contract.test.mjs
      - run: node --test tests/contracts/p2-6-5-rollback-qualification.contract.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
