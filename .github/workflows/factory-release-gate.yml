name: Factory Release Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - name: Dependency security audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            audit_log="${RUNNER_TEMP}/npm-audit-${attempt}.log"
            set +e
            npm audit --audit-level=low --fetch-timeout=30000 --fetch-retries=0 2>&1 | tee "${audit_log}"
            audit_status=${PIPESTATUS[0]}
            set -e

            if [ "${audit_status}" -eq 0 ]; then
              exit 0
            fi

            if grep -Eqi 'audit endpoint returned an error|5[0-9]{2} (Service Unavailable|Internal Server Error|Bad Gateway|Gateway Timeout)|ECONNRESET|ECONNREFUSED|ETIMEDOUT|EAI_AGAIN' "${audit_log}"; then
              if [ "${attempt}" -lt 3 ]; then
                echo "npm audit transport failure on attempt ${attempt}; retrying without weakening the audit policy."
                sleep $((attempt * 5))
                continue
              fi
              echo "npm audit transport failure persisted for all attempts."
            fi

            exit "${audit_status}"
          done
      - run: npm test
      - name: Runtime cell architecture contracts
        run: node --test tests/contracts/p5-1-runtime-cells-control-plane.contract.test.mjs tests/contracts/p5-2-runtime-cell-health-recovery.contract.test.mjs
      - name: Runtime target registry contracts
        run: node --test tests/contracts/p5-4-runtime-target-registry.contract.test.mjs
      - name: Runtime target shadow readiness contracts
        run: node --test tests/contracts/p5-5-runtime-target-shadow-readiness.contract.test.mjs
      - name: Runtime cell cutover plan contracts
        run: node --test tests/contracts/p5-6-runtime-cell-cutover-plan.contract.test.mjs
      - name: Runtime cell controlled cutover contracts
        run: node --test tests/contracts/p5-7-runtime-cell-controlled-cutover.contract.test.mjs
      - name: Runtime Sandbox canary routing contracts
        run: node --test tests/contracts/p5-8-runtime-sandbox-canary-routing.contract.test.mjs
      - run: node --test tests/contracts/control-panel-factory-routing.contract.test.mjs
      - run: node --test tests/contracts/p2-6-4-published-derivative-lineage.contract.test.mjs
      - run: node --test tests/contracts/p2-6-4-relational-authority-jsonb.contract.test.mjs
      - run: node --test tests/contracts/p2-6-5-rollback-qualification.contract.test.mjs
      - run: node --test tests/contracts/factory-ai-hotel-scanner.contract.test.mjs
      - run: node --test tests/contracts/hotel-scanner-social-evidence.contract.test.mjs
      - run: node --test tests/contracts/hub-design-studio-live-preview.contract.test.mjs
      - run: node --test tests/contracts/hub-design-studio-professional-workflow.contract.test.mjs
      - run: node --test tests/contracts/hub-experience-builder-v2.contract.test.mjs
      - run: node --test tests/contracts/hub-design-draft-versioning.contract.test.mjs
      - run: node --test tests/contracts/design-revision-factory-handoff.contract.test.mjs
      - run: node --test tests/contracts/guest-communications-branded-staff.contract.test.mjs
      - run: node --test tests/contracts/sandbox-direct-communications-rpc.contract.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
