name: Temporary Factory Dependency Repair

on:
  push:
    branches:
      - feat/factory-prepare-sandbox-load-acceptance
    paths:
      - ".github/workflows/temporary-factory-dependency-repair.yml"

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fix
        run: npm audit fix
      - name: Refuse manifest changes
        run: git diff --exit-code -- package.json
      - name: Require zero dependency advisories
        run: npm audit --audit-level=low
      - name: Validate lockfile install
        run: npm ci
      - name: Commit repaired lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change was produced"
            exit 1
          fi
          if ! git diff --quiet -- . ':(exclude)package-lock.json'; then
            echo "Unexpected working-tree changes outside package-lock.json"
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh dependency security lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
