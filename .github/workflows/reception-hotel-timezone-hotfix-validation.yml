name: Reception Hotel Timezone Hotfix Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/staff/[hotelSlug]/reception/page.tsx"
      - "components/staff/pages/ReceptionPageContent.tsx"
      - "lib/hotels/getHotelByAnySlug.ts"
      - "tests/contracts/reception-hotel-timezone.contract.test.mjs"
      - ".github/workflows/reception-hotel-timezone-hotfix-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/contracts/reception-hotel-timezone.contract.test.mjs
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
