name: P2.6.5 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/control-plane/onboarding/production-live-rollback/**"
      - "lib/server/factory-production-live-rollback.ts"
      - "supabase/migrations/20260817172000_p2_6_5_production_live_rollback.sql"
      - "tests/contracts/p2-6-5-production-live-rollback.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-p2-6-5-production-live-rollback.json"
      - "scripts/tenant-isolation-guard.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
