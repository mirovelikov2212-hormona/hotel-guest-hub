name: M14.3.2 Closeout Patcher

on:
  push:
    branches:
      - audit/m14-3-2-closeout-patcher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m14-3-2-closeout-docs
          fetch-depth: 0
      - name: Update canonical M14.3 state
        run: echo '' | base64 -d | python
      - name: Validate and push runbook update
        run: |
          git diff --check
          git diff -- docs/runbooks/StayHub_M11_M16_execution_state.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runbooks/StayHub_M11_M16_execution_state.md
          git commit -m 'Close M14.3.2 and open M14.3.3'
          git push origin HEAD:audit/m14-3-2-closeout-docs
