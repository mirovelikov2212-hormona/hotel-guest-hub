name: M14.3.2 Tenant Baseline Update

on:
  push:
    branches:
      - audit/m14-3-2-baseline-update-a94ead4

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m14-3-2-native-staff-reconciliation
          fetch-depth: 0
      - name: Update reviewed baseline
        run: echo '' | base64 -d | python
      - name: Commit baseline only
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add tests/contracts/tenant-isolation-baseline.json && git commit -m 'Review M14.3.2 tenant query surfaces' && git push origin HEAD:audit/m14-3-2-native-staff-reconciliation
