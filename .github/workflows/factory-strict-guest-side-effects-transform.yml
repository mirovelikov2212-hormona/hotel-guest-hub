name: Factory Strict Guest Side Effects Transform

on:
  push:
    branches:
      - factory/strict-guest-runtime-side-effects-20260820

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded transform
        run: node scripts/apply-factory-strict-guest-side-effects.mjs
      - name: Focused strict Guest contract
        run: npm run test:shared-guest-runtime
      - name: Full test suite
        run: npm test
      - name: Production build gate
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      - name: Commit verified runtime changes and remove harness
        run: |
          rm -f scripts/apply-factory-strict-guest-side-effects.mjs
          rm -f .github/workflows/factory-strict-guest-side-effects-transform.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Factory Guest runtime: suppress unconfigured legacy side effects"
          git push origin "HEAD:${GITHUB_REF_NAME}"
