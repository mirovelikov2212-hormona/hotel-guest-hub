name: INFRA-0 Survey Lint Fix

on:
  push:
    branches:
      - infra/infra-0-capacity-foundation-20260816
    paths:
      - .github/workflows/infra0-survey-lint-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/infra-0-capacity-foundation-20260816
      - name: Remove redundant read-state effect
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("components/staff/StaffSurveyCards.tsx")
          text = path.read_text()
          old = '''  useEffect(() => {\n    if (!isUnread && mode !== "report") setIsOpen(false);\n  }, [isUnread, mode]);\n\n'''
          if old not in text:
              raise SystemExit("target effect not found")
          path.write_text(text.replace(old, "", 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/staff/StaffSurveyCards.tsx
          git commit -m "INFRA-0: keep survey collapse event-driven"
          git push origin HEAD:infra/infra-0-capacity-foundation-20260816
