name: Shared Guest Hero CSS Cleanup Once

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-factory/shared-guest-runtime-genericization-20260819
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove tenant-specific hero CSS
        run: python3 scripts/remove_shared_guest_hero_tenant_css_once.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused contract
        run: npm run test:shared-guest-runtime

      - name: Run full tests and tenant isolation
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

      - name: Commit only after all gates pass
        shell: bash
        run: |
          rm scripts/remove_shared_guest_hero_tenant_css_once.py
          rm .github/workflows/shared-guest-hero-css-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css tests/contracts/shared-guest-runtime-genericization.contract.test.mjs scripts/remove_shared_guest_hero_tenant_css_once.py .github/workflows/shared-guest-hero-css-cleanup-once.yml
          git diff --cached --check
          git commit -m "Shared Guest runtime: remove tenant-specific hero CSS"
          git push origin HEAD:product-factory/shared-guest-runtime-genericization-20260819
