name: Temporary Communications Proof Payload

on:
  push:
    branches:
      - feature/factory-communications-persistence-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate exact proof payload
        run: |
          node --input-type=module <<'NODE'
