name: Temporary Factory services v2 readability

on:
  push:
    branches:
      - feature/factory-standard-services-v2-20260826

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/factory-standard-services-v2-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Improve readability without changing behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/product-factory/factory-guest-runtime-config-model.mjs')
          s = p.read_text()
          start = s.index('  const department = service.department_code ? departments.get(service.department_code) : null;')
          end_marker = '    canonicalRef: String(definition.canonicalRef || standard?.id || service.key),\n  };'
          end = s.index(end_marker, start) + len(end_marker)
          block = '''    const department = service.department_code
              ? departments.get(service.department_code)
              : null;
            const guestVisible = Boolean(service.department_code && department);
            const requestKind = String(
              definition.requestKind || standard?.requestKind || "standard",
            );
            const requiresNote =
              typeof definition.requiresNote === "boolean"
                ? definition.requiresNote
                : Boolean(standard?.requiresNote);
            const requiresQuantity =
              typeof definition.requiresQuantity === "boolean"
                ? definition.requiresQuantity
                : Boolean(standard?.requiresQuantity);
            const requiresTime =
              typeof definition.requiresTime === "boolean"
                ? definition.requiresTime
                : Boolean(standard?.requiresTime);
            const timeMode = String(definition.timeMode || standard?.timeMode || "none");
            const success = localizedTextMap(locales, definition.success, standard?.success);
            const section = String(definition.section || standard?.departmentId || "services");
            const intentTags = Array.isArray(definition.intentTags)
              ? definition.intentTags
              : Array.isArray(standard?.intentTags)
                ? standard.intentTags
                : [service.key];
            const options = Array.isArray(definition.options) ? definition.options : [];
            const minQty = Number(definition.minQty ?? standard?.minQty);
            const maxQty = Number(definition.maxQty ?? standard?.maxQty);

            return {
              id: service.key,
              type: "request",
              category: section,
              enabled: guestVisible,
              sortOrder: index + 1,
              requestKind,
              targetDepartment: service.department_code || "none",
              ...(department?.after_hours_department_code
                ? { afterHoursDepartment: department.after_hours_department_code }
                : {}),
              requestType: service.key,
              requiresNote,
              requiresQuantity,
              ...(requiresQuantity && Number.isFinite(minQty) ? { minQty } : {}),
              ...(requiresQuantity && Number.isFinite(maxQty) ? { maxQty } : {}),
              requiresTime,
              timeMode,
              options,
              guestVisible,
              staffVisible: guestVisible,
              aiVisible:
                typeof definition.aiVisible === "boolean"
                  ? definition.aiVisible
                  : Boolean(standard?.aiVisible),
              confirmationMode: workflow?.hasApproval ? "staff_required" : "instant",
              title,
              subtitle: {},
              description,
              policy: {},
              success,
              staffLabel,
              section,
              requiresBilling: Boolean(workflow?.hasBilling),
              notifyDepartments: [],
              keywords: [service.key, ...new Set(Object.values(title).filter(Boolean))],
              aliasesByLang: {},
              intentTags: [...intentTags],
              uiSectionId: String(definition.uiSectionId || section),
              canonicalRef: String(definition.canonicalRef || standard?.id || service.key),
            };'''
          p.write_text(s[:start] + block + s[end:])

          p = Path('tests/contracts/factory-standard-core-catalog.contract.test.mjs')
          s = p.read_text().replace('Factory Standard v1 seeds only generic non-paid operational services', 'Factory Standard v2 exposes only generic non-paid operational services')
          s = s.replace('''const FORBIDDEN_AQUAMARINE_PAID_PRODUCTS = [
            "coffee_capsules", "coffee-capsules", "pillow_menu", "pillow-menu", "massage_booking", "massage-booking", "spa-massage",
          ];''', '''const FORBIDDEN_AQUAMARINE_PAID_PRODUCTS = [
            "coffee_capsules",
            "coffee-capsules",
            "pillow_menu",
            "pillow-menu",
            "massage_booking",
            "massage-booking",
            "spa-massage",
          ];''')
          s = s.replace('''  for (const price of ["2.05", "2,05", "11.00", "11,00", "25.00", "25,00"]) assert.equal(serialized.includes(price), false);''', '''  for (const price of ["2.05", "2,05", "11.00", "11,00", "25.00", "25,00"]) {
            assert.equal(serialized.includes(price), false);
          }''')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          node --test tests/contracts/factory-standard-core-catalog.contract.test.mjs
          npm test
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      - name: Commit cleanup
        run: |
          git config user.name "StayHub Factory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/product-factory/factory-guest-runtime-config-model.mjs tests/contracts/factory-standard-core-catalog.contract.test.mjs
          git commit -m "Polish Factory Standard service projection readability"
          git push origin HEAD:feature/factory-standard-services-v2-20260826
