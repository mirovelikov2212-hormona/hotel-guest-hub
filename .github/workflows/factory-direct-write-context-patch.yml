name: Factory Direct Write Context Patch

on:
  push:
    branches:
      - perf/factory-guest-write-context-v1
    paths:
      - ".github/workflows/factory-direct-write-context-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply request-scoped Factory write bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Consolidated context: one RPC can bootstrap hotel/runtime + ready identity.
          replace_once(
              "lib/server/factory-guest-context.ts",
              '''type FactoryGuestWriteIdentityResult =\n  | { kind: "ready"; stay: JsonObject; device: JsonObject; roomId: string }\n  | { kind: "missing" }\n  | { kind: "stay_ended" };''',
              '''export type FactoryGuestReadyIdentity = {\n  kind: "ready";\n  stay: JsonObject;\n  device: JsonObject;\n  roomId: string;\n};\n\ntype FactoryGuestWriteIdentityResult =\n  | FactoryGuestReadyIdentity\n  | { kind: "missing" }\n  | { kind: "stay_ended" };\n\nexport type FactoryGuestWriteContextFastPath = {\n  hotel: FactoryGuestHotelScope;\n  runtime: FactoryGuestRuntime;\n  identity: FactoryGuestReadyIdentity;\n};''',
          )

          replace_once(
              "lib/server/factory-guest-context.ts",
              '''export async function resolveFactoryGuestWriteIdentity(input: {\n  hotelId: string;\n  room: string;\n  stayId?: unknown;\n  stayDeviceId?: unknown;\n}): Promise<FactoryGuestWriteIdentityResult | null> {\n  const hotelId = normalizeString(input.hotelId);\n  const room = normalizeRoom(input.room);\n  const stayId = normalizeString(input.stayId);\n  const stayDeviceId = normalizeString(input.stayDeviceId);\n  const runtime = getPrimedFactoryRuntimeByHotelId(hotelId);\n\n  if (!runtime || !room || !isUuid(stayId) || !isUuid(stayDeviceId)) return null;\n\n  const { data, error } = await supabaseAdmin.rpc(\n    "get_factory_guest_write_context_v1",\n    {\n      p_hotel_slug: runtime.hotelSlug,\n      p_room_number: room,\n      p_stay_id: stayId,\n      p_stay_device_id: stayDeviceId,\n    },\n  );\n\n  if (error) {\n    if (!isMissingRpc(error, "get_factory_guest_write_context_v1")) {\n      console.warn("Factory guest write context unavailable; using legacy stay validation", {\n        hotelId,\n        hotelSlug: runtime.hotelSlug,\n        error,\n      });\n    }\n    return null;\n  }\n\n  if (data == null) return null;\n  if (!isObject(data)) throw new Error("FACTORY_GUEST_WRITE_CONTEXT_INVALID");\n  if (data.status === "commercial_blocked") throwCommercialBlocked(data);\n  if (data.status === "fallback_required") return null;\n  if (data.status === "invalid_room" || data.status === "stay_required") {\n    return { kind: "missing" };\n  }\n  if (data.status === "stay_ended") return { kind: "stay_ended" };\n  if (data.status !== "ready") throw new Error("FACTORY_GUEST_WRITE_CONTEXT_STATUS_INVALID");\n\n  const contextRuntime = parseRuntime(data.runtime);\n  if (contextRuntime.hotelId !== hotelId) {\n    throw new Error("FACTORY_GUEST_WRITE_CONTEXT_SCOPE_MISMATCH");\n  }\n  rememberRuntime(contextRuntime);\n\n  const stay = isObject(data.stay) ? data.stay : null;\n  const device = isObject(data.device) ? data.device : null;\n  const roomId = normalizeString(data.roomId);\n  if (\n    !stay ||\n    !device ||\n    !isUuid(roomId) ||\n    normalizeString(stay.id) !== stayId ||\n    normalizeString(stay.hotel_id) !== hotelId ||\n    normalizeRoom(stay.room_number) !== room ||\n    normalizeString(device.id) !== stayDeviceId ||\n    normalizeString(device.stay_id) !== stayId ||\n    normalizeString(device.hotel_id) !== hotelId ||\n    normalizeRoom(device.room_number) !== room\n  ) {\n    throw new Error("FACTORY_GUEST_WRITE_CONTEXT_IDENTITY_MISMATCH");\n  }\n\n  return { kind: "ready", stay, device, roomId };\n}\n''',
              '''type LoadedFactoryGuestWriteContext =\n  | {\n      kind: "ready";\n      runtime: FactoryGuestRuntime;\n      identity: FactoryGuestReadyIdentity;\n    }\n  | { kind: "missing" }\n  | { kind: "stay_ended" }\n  | { kind: "fallback" };\n\nfunction hotelScopeFromRuntime(runtime: FactoryGuestRuntime): FactoryGuestHotelScope {\n  return {\n    id: runtime.hotelId,\n    slug: runtime.hotelSlug,\n    public_slug: runtime.publicSlug,\n    name: runtime.hotelName,\n    timezone: runtime.hotelTimezone,\n    active: true,\n    is_sandbox: true,\n    production_hotel_id: runtime.productionHotelId,\n  };\n}\n\nasync function loadFactoryGuestWriteContext(input: {\n  hotelSlug: string;\n  room: string;\n  stayId: unknown;\n  stayDeviceId: unknown;\n  expectedHotelId?: string | null;\n}): Promise<LoadedFactoryGuestWriteContext | null> {\n  const hotelSlug = normalizeSlug(input.hotelSlug);\n  const room = normalizeRoom(input.room);\n  const stayId = normalizeString(input.stayId);\n  const stayDeviceId = normalizeString(input.stayDeviceId);\n  const expectedHotelId = normalizeString(input.expectedHotelId);\n\n  if (!hotelSlug || !room || !isUuid(stayId) || !isUuid(stayDeviceId)) return null;\n\n  const { data, error } = await supabaseAdmin.rpc(\n    "get_factory_guest_write_context_v1",\n    {\n      p_hotel_slug: hotelSlug,\n      p_room_number: room,\n      p_stay_id: stayId,\n      p_stay_device_id: stayDeviceId,\n    },\n  );\n\n  if (error) {\n    if (!isMissingRpc(error, "get_factory_guest_write_context_v1")) {\n      console.warn("Factory guest write context unavailable; using legacy stay validation", {\n        hotelSlug,\n        expectedHotelId: expectedHotelId || null,\n        error,\n      });\n    }\n    return null;\n  }\n\n  if (data == null) return null;\n  if (!isObject(data)) throw new Error("FACTORY_GUEST_WRITE_CONTEXT_INVALID");\n  if (data.status === "commercial_blocked") throwCommercialBlocked(data);\n  if (data.status === "fallback_required") return { kind: "fallback" };\n  if (data.status === "invalid_room" || data.status === "stay_required") {\n    return { kind: "missing" };\n  }\n  if (data.status === "stay_ended") return { kind: "stay_ended" };\n  if (data.status !== "ready") throw new Error("FACTORY_GUEST_WRITE_CONTEXT_STATUS_INVALID");\n\n  const runtime = parseRuntime(data.runtime);\n  if (\n    (expectedHotelId && runtime.hotelId !== expectedHotelId) ||\n    (hotelSlug !== runtime.hotelSlug && hotelSlug !== runtime.publicSlug)\n  ) {\n    throw new Error("FACTORY_GUEST_WRITE_CONTEXT_SCOPE_MISMATCH");\n  }\n\n  const stay = isObject(data.stay) ? data.stay : null;\n  const device = isObject(data.device) ? data.device : null;\n  const roomId = normalizeString(data.roomId);\n  if (\n    !stay ||\n    !device ||\n    !isUuid(roomId) ||\n    normalizeString(stay.id) !== stayId ||\n    normalizeString(stay.hotel_id) !== runtime.hotelId ||\n    normalizeRoom(stay.room_number) !== room ||\n    normalizeString(device.id) !== stayDeviceId ||\n    normalizeString(device.stay_id) !== stayId ||\n    normalizeString(device.hotel_id) !== runtime.hotelId ||\n    normalizeRoom(device.room_number) !== room\n  ) {\n    throw new Error("FACTORY_GUEST_WRITE_CONTEXT_IDENTITY_MISMATCH");\n  }\n\n  rememberRuntime(runtime);\n  return {\n    kind: "ready",\n    runtime,\n    identity: { kind: "ready", stay, device, roomId },\n  };\n}\n\n/**\n * Positive Factory guest writes can bootstrap tenant scope, materialized runtime\n * and stay/device authority with one database roundtrip. Negative, rolling-test\n * and non-Factory cases deliberately return null so existing legacy semantics\n * remain authoritative. Identity is request-scoped and is never cached.\n */\nexport async function resolveFactoryGuestWriteContextFastPath(input: {\n  hotelSlug: string;\n  room: string;\n  stayId: unknown;\n  stayDeviceId: unknown;\n}): Promise<FactoryGuestWriteContextFastPath | null> {\n  const loaded = await loadFactoryGuestWriteContext(input);\n  if (!loaded || loaded.kind !== "ready") return null;\n\n  return {\n    hotel: hotelScopeFromRuntime(loaded.runtime),\n    runtime: loaded.runtime,\n    identity: loaded.identity,\n  };\n}\n\nexport async function resolveFactoryGuestWriteIdentity(input: {\n  hotelId: string;\n  room: string;\n  stayId?: unknown;\n  stayDeviceId?: unknown;\n}): Promise<FactoryGuestWriteIdentityResult | null> {\n  const hotelId = normalizeString(input.hotelId);\n  const runtime = getPrimedFactoryRuntimeByHotelId(hotelId);\n  if (!runtime) return null;\n\n  const loaded = await loadFactoryGuestWriteContext({\n    hotelSlug: runtime.hotelSlug,\n    room: input.room,\n    stayId: input.stayId,\n    stayDeviceId: input.stayDeviceId,\n    expectedHotelId: hotelId,\n  });\n\n  if (!loaded || loaded.kind === "fallback") return null;\n  if (loaded.kind === "missing") return { kind: "missing" };\n  if (loaded.kind === "stay_ended") return { kind: "stay_ended" };\n  return loaded.identity;\n}\n''',
          )

          # M13 lifecycle remains one shared application-visible validator.
          replace_once(
              "lib/server/guest-stays.ts",
              '''import { resolveFactoryGuestWriteIdentity } from "@/lib/server/factory-guest-context";''',
              '''import {\n  resolveFactoryGuestWriteIdentity,\n  type FactoryGuestReadyIdentity,\n} from "@/lib/server/factory-guest-context";''',
          )
          replace_once(
              "lib/server/guest-stays.ts",
              '''export async function validateGuestStayIdentity(input: {\n  hotelId: string;\n  room: string;\n  stayId?: unknown;\n  stayDeviceId?: unknown;\n}) {\n  const factoryIdentity = await resolveFactoryGuestWriteIdentity(input);\n  if (!factoryIdentity) {\n    return validateGuestStayIdentityLegacy(input);\n  }\n  if (factoryIdentity.kind === "missing") return null;\n  if (factoryIdentity.kind === "stay_ended") throw new Error("STAY_ENDED");\n\n  // The consolidated RPC proves tenant/room/stay/device identity, but M13\n  // lifecycle authority remains application-visible and fail-closed here too.\n  // This keeps the shared mutation boundary explicit instead of trusting a\n  // performance shortcut to redefine write capability.\n  const currentStay = factoryIdentity.stay as unknown as GuestStayRow;\n  const lifecycleState = deriveGuestStayLifecycle({\n    status: currentStay.status,\n    lateCheckoutStatus: currentStay.late_checkout_status,\n    scheduledCheckOutAt: currentStay.scheduled_check_out_at,\n    effectiveCheckOutAt: currentStay.effective_check_out_at,\n    nowMs: Date.now(),\n  });\n  const access = getGuestStayAccessPolicy(lifecycleState);\n  if (!access.canWrite) throw new Error("STAY_ENDED");\n\n  return {\n    stay: currentStay,\n    device: factoryIdentity.device as unknown as GuestStayDeviceRow,\n  };\n}\n''',
              '''export function validatePreparedFactoryGuestWriteIdentity(\n  factoryIdentity: FactoryGuestReadyIdentity,\n) {\n  // The consolidated RPC proves tenant/room/stay/device identity, but M13\n  // lifecycle authority remains application-visible and fail-closed here too.\n  // Request-scoped prepared identity is never persisted or reused across writes.\n  const currentStay = factoryIdentity.stay as unknown as GuestStayRow;\n  const lifecycleState = deriveGuestStayLifecycle({\n    status: currentStay.status,\n    lateCheckoutStatus: currentStay.late_checkout_status,\n    scheduledCheckOutAt: currentStay.scheduled_check_out_at,\n    effectiveCheckOutAt: currentStay.effective_check_out_at,\n    nowMs: Date.now(),\n  });\n  const access = getGuestStayAccessPolicy(lifecycleState);\n  if (!access.canWrite) throw new Error("STAY_ENDED");\n\n  return {\n    stay: currentStay,\n    device: factoryIdentity.device as unknown as GuestStayDeviceRow,\n  };\n}\n\nexport async function validateGuestStayIdentity(input: {\n  hotelId: string;\n  room: string;\n  stayId?: unknown;\n  stayDeviceId?: unknown;\n}) {\n  const factoryIdentity = await resolveFactoryGuestWriteIdentity(input);\n  if (!factoryIdentity) {\n    return validateGuestStayIdentityLegacy(input);\n  }\n  if (factoryIdentity.kind === "missing") return null;\n  if (factoryIdentity.kind === "stay_ended") throw new Error("STAY_ENDED");\n  return validatePreparedFactoryGuestWriteIdentity(factoryIdentity);\n}\n''',
          )

          # Request create: direct Factory bootstrap, then materialized config reuse.
          replace_once(
              "app/api/guest/request-create/route.ts",
              '''import { markLateCheckoutRequested, validateGuestStayIdentity } from "@/lib/server/guest-stays";''',
              '''import {\n  markLateCheckoutRequested,\n  validateGuestStayIdentity,\n  validatePreparedFactoryGuestWriteIdentity,\n} from "@/lib/server/guest-stays";\nimport { resolveFactoryGuestWriteContextFastPath } from "@/lib/server/factory-guest-context";''',
          )
          replace_once(
              "app/api/guest/request-create/route.ts",
              '''    const hotel = await resolveHotelByAnySlugAdmin(hotelSlug);''',
              '''    const factoryWriteContext = await resolveFactoryGuestWriteContextFastPath({\n      hotelSlug,\n      room,\n      stayId,\n      stayDeviceId,\n    });\n    const hotel = factoryWriteContext?.hotel ?? await resolveHotelByAnySlugAdmin(hotelSlug);''',
          )
          replace_once(
              "app/api/guest/request-create/route.ts",
              '''    const stayIdentity = await validateGuestStayIdentity({\n      hotelId: hotel.id,\n      room,\n      stayId,\n      stayDeviceId,\n    });''',
              '''    const stayIdentity = factoryWriteContext\n      ? validatePreparedFactoryGuestWriteIdentity(factoryWriteContext.identity)\n      : await validateGuestStayIdentity({\n          hotelId: hotel.id,\n          room,\n          stayId,\n          stayDeviceId,\n        });''',
          )

          # Survey: same direct bootstrap; validateHotelRoom reuses primed runtime.
          replace_once(
              "app/api/guest/day3-survey/route.ts",
              '''import { getHotelTimeParts, validateGuestStayIdentity } from "@/lib/server/guest-stays";''',
              '''import {\n  getHotelTimeParts,\n  validateGuestStayIdentity,\n  validatePreparedFactoryGuestWriteIdentity,\n} from "@/lib/server/guest-stays";\nimport { resolveFactoryGuestWriteContextFastPath } from "@/lib/server/factory-guest-context";''',
          )
          replace_once(
              "app/api/guest/day3-survey/route.ts",
              '''    const hotel = await getHotelByAnySlugAdmin(hotelSlug);''',
              '''    const factoryWriteContext = await resolveFactoryGuestWriteContextFastPath({\n      hotelSlug,\n      room,\n      stayId,\n      stayDeviceId,\n    });\n    const hotel = factoryWriteContext?.hotel ?? await getHotelByAnySlugAdmin(hotelSlug);''',
          )
          replace_once(
              "app/api/guest/day3-survey/route.ts",
              '''    const stayIdentity = await validateGuestStayIdentity({\n      hotelId: hotel.id,\n      room,\n      stayId,\n      stayDeviceId,\n    });''',
              '''    const stayIdentity = factoryWriteContext\n      ? validatePreparedFactoryGuestWriteIdentity(factoryWriteContext.identity)\n      : await validateGuestStayIdentity({\n          hotelId: hotel.id,\n          room,\n          stayId,\n          stayDeviceId,\n        });''',
          )

          # Massage: optimistic direct bootstrap from normalized room/stay identity.
          replace_once(
              "app/api/guest/massages/route.ts",
              '''import { validateGuestStayIdentity } from "@/lib/server/guest-stays";''',
              '''import {\n  validateGuestStayIdentity,\n  validatePreparedFactoryGuestWriteIdentity,\n} from "@/lib/server/guest-stays";\nimport {\n  resolveFactoryGuestWriteContextFastPath,\n  type FactoryGuestReadyIdentity,\n} from "@/lib/server/factory-guest-context";''',
          )
          replace_once(
              "app/api/guest/massages/route.ts",
              '''async function requireMassageGuestStayIdentity(input: {\n  hotelId: string;\n  room: string;\n  stayId: unknown;\n  stayDeviceId: unknown;\n}) {\n  try {\n    const identity = await validateGuestStayIdentity(input);''',
              '''async function requireMassageGuestStayIdentity(input: {\n  hotelId: string;\n  room: string;\n  stayId: unknown;\n  stayDeviceId: unknown;\n  preparedFactoryIdentity?: FactoryGuestReadyIdentity | null;\n}) {\n  try {\n    const identity = input.preparedFactoryIdentity\n      ? validatePreparedFactoryGuestWriteIdentity(input.preparedFactoryIdentity)\n      : await validateGuestStayIdentity(input);''',
          )
          replace_once(
              "app/api/guest/massages/route.ts",
              '''    // Resolve tenant identity first, but do not inspect operational booking\n    // authority until the public payload and confirmed stay/device identity have\n    // both been validated. Unauthenticated callers must not reach authority\n    // selection, adapter feature flags, or booking write paths.\n    const hotel = await resolveHotelByAnySlugAdmin(hotelSlug);\n    requestHotelId = hotel.id;\n    timing.mark("hotel");\n\n    requireConfirmedRoom(body.roomConfirmed);''',
              '''    // A valid Factory stay/device can bootstrap tenant scope and runtime in\n    // the same authoritative roundtrip. Invalid/non-Factory inputs fall through\n    // to the unchanged hotel-scope + stay-validation path below. Operational\n    // massage authority is still selected only after public payload validation.\n    const candidateRoom = normalizeRoomForComparison(body.room ?? body.roomNumber);\n    const factoryWriteContext = ROOM_RE.test(candidateRoom)\n      ? await resolveFactoryGuestWriteContextFastPath({\n          hotelSlug,\n          room: candidateRoom,\n          stayId: body.stayId,\n          stayDeviceId: body.stayDeviceId,\n        })\n      : null;\n    const hotel = factoryWriteContext?.hotel ?? await resolveHotelByAnySlugAdmin(hotelSlug);\n    requestHotelId = hotel.id;\n    timing.mark("hotel");\n\n    requireConfirmedRoom(body.roomConfirmed);''',
          )
          replace_once(
              "app/api/guest/massages/route.ts",
              '''    const stayIdentity = await requireMassageGuestStayIdentity({\n      hotelId: hotel.id,\n      room,\n      stayId: body.stayId,\n      stayDeviceId: body.stayDeviceId,\n    });''',
              '''    const stayIdentity = await requireMassageGuestStayIdentity({\n      hotelId: hotel.id,\n      room,\n      stayId: body.stayId,\n      stayDeviceId: body.stayDeviceId,\n      preparedFactoryIdentity: factoryWriteContext?.identity,\n    });''',
          )

          # Contract proof for the one-roundtrip positive path and request-scoped identity.
          replace_once(
              "tests/contracts/factory-guest-write-context-wiring.contract.test.mjs",
              '''  const stays = await readProjectFile("lib/server/guest-stays.ts");\n\n  assertContains(context, 'supabaseAdmin.rpc("get_factory_guest_scope_v1"');''',
              '''  const stays = await readProjectFile("lib/server/guest-stays.ts");\n  const requestRoute = await readProjectFile("app/api/guest/request-create/route.ts");\n  const surveyRoute = await readProjectFile("app/api/guest/day3-survey/route.ts");\n  const massageRoute = await readProjectFile("app/api/guest/massages/route.ts");\n\n  assertContains(context, 'supabaseAdmin.rpc("get_factory_guest_scope_v1"');''',
          )
          replace_once(
              "tests/contracts/factory-guest-write-context-wiring.contract.test.mjs",
              '''  assertContains(stays, "resolveFactoryGuestWriteIdentity(input)");\n  assertContains(stays, "validateGuestStayIdentityLegacy(input)");\n});''',
              '''  assertContains(stays, "resolveFactoryGuestWriteIdentity(input)");\n  assertContains(stays, "validateGuestStayIdentityLegacy(input)");\n  assertContains(stays, "validatePreparedFactoryGuestWriteIdentity");\n  assertContains(context, "resolveFactoryGuestWriteContextFastPath");\n  assertContains(context, "Identity is request-scoped and is never cached");\n  for (const route of [requestRoute, surveyRoute, massageRoute]) {\n    assertContains(route, "resolveFactoryGuestWriteContextFastPath");\n    assertContains(route, "validatePreparedFactoryGuestWriteIdentity");\n  }\n  assert.ok(\n    !context.includes("identityByHotel") && !context.includes("identityByStay"),\n    "validated stay/device identity must not be cached across guest writes",\n  );\n});''',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused Factory guest-write contract
        run: node --test tests/contracts/factory-guest-write-context-wiring.contract.test.mjs

      - name: Run full regression suite
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Commit validated runtime change
        shell: bash
        run: |
          rm .github/workflows/factory-direct-write-context-patch.yml
          git config user.name "stayhub-ci"
          git config user.email "stayhub-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Collapse Factory guest write authority roundtrips"
          git push origin HEAD:perf/factory-guest-write-context-v1
