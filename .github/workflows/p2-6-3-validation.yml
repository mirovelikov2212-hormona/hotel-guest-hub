name: P2.6.3 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/control-plane/onboarding/production-runtime-certification/**"
      - "lib/server/factory-production-runtime-certification.ts"
      - "supabase/migrations/20260817153000_p2_6_3_production_runtime_certification.sql"
      - "tests/contracts/p2-6-3-production-runtime-certification.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-p2-6-3-production-runtime-certification.json"
      - "scripts/tenant-isolation-guard.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
