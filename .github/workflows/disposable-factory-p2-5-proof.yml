name: Disposable Factory P2.5 Proof Execution

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - "app/api/factory-proof/runtime/route.ts"
      - "tests/contracts/disposable-proof-runner.contract.test.mjs"
      - ".github/workflows/disposable-factory-p2-5-proof.yml"

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  proof:
    if: github.head_ref == 'proof-runner/disposable-e2e-20260819-0835'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_BASE_URL: https://hotel-guest-hub-git-proof-run-ac3f3f-miroslav-velikovs-projects.vercel.app
      GH_TOKEN: ${{ github.token }}
      PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub Actions OIDC token for Vercel Trusted Sources
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Wait for exact Factory Release Gate and Vercel Preview
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            runs=$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/factory-release-gate.yml/runs?head_sha=${PROOF_HEAD_SHA}&event=pull_request&per_page=20")
            release_ok=$(node -e '
              const input=JSON.parse(process.argv[1]);
              const ok=(input.workflow_runs||[]).some((run)=>run.head_sha===process.env.PROOF_HEAD_SHA && run.status==="completed" && run.conclusion==="success");
              process.stdout.write(ok ? "1" : "0");
            ' "$runs")

            statuses=$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${PROOF_HEAD_SHA}/statuses?per_page=100")
            vercel_ok=$(node -e '
              const input=JSON.parse(process.argv[1]);
              const ok=Array.isArray(input) && input.some((status)=>status.state==="success" && /vercel/i.test(String(status.context||"")));
              process.stdout.write(ok ? "1" : "0");
            ' "$statuses")

            if [ "$release_ok" = "1" ] && [ "$vercel_ok" = "1" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "Exact Factory Release Gate / Vercel Preview did not become green for ${PROOF_HEAD_SHA}." >&2
            exit 21
          fi

      - name: Run trusted Preview smoke and P2.5 certification
        id: proof
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          endpoint="${PREVIEW_BASE_URL}/api/factory-proof/runtime"
          oidc_header="x-vercel-trusted-oidc-idp-token: ${VERCEL_TRUSTED_OIDC_TOKEN}"

          start_json=$(curl --fail-with-body -fsS -H "$oidc_header" "${endpoint}?action=start")
          smoke_run_id=$(node -e '
            const value=JSON.parse(process.argv[1]);
            if (!value.ok || !value.smokeRunId) process.exit(1);
            process.stdout.write(String(value.smokeRunId));
          ' "$start_json")
          echo "smoke_run_id=${smoke_run_id}" >> "$GITHUB_OUTPUT"

          settled=0
          for attempt in $(seq 1 30); do
            settle_json=$(curl --fail-with-body -fsS -H "$oidc_header" "${endpoint}?action=settle&smokeRunId=${smoke_run_id}")
            settle_state=$(node -e '
              const value=JSON.parse(process.argv[1]);
              process.stdout.write(String(value.state||""));
            ' "$settle_json")
            if [ "$settle_state" = "settle_emitted" ] || [ "$settle_state" = "already_emitted" ]; then
              settled=1
              break
            fi
            if [ "$settle_state" != "waiting" ]; then
              echo "Unexpected settle state: ${settle_state}" >&2
              echo "$settle_json" >&2
              exit 22
            fi
            sleep 10
          done
          if [ "$settled" != "1" ]; then
            echo "P4.8 smoke did not settle within the allowed window." >&2
            exit 23
          fi

          observed=0
          status_json=""
          for attempt in $(seq 1 30); do
            status_json=$(curl --fail-with-body -fsS -H "$oidc_header" "${endpoint}?action=status&smokeRunId=${smoke_run_id}")
            observation_status=$(node -e '
              const value=JSON.parse(process.argv[1]);
              process.stdout.write(String(value?.observation?.status||""));
            ' "$status_json")
            if [ "$observation_status" = "observed_clean" ]; then
              observed=1
              break
            fi
            if [ "$observation_status" = "observed_errors" ]; then
              echo "P4.8 observed runtime errors." >&2
              echo "$status_json" >&2
              exit 24
            fi
            sleep 5
          done
          if [ "$observed" != "1" ]; then
            echo "P4.8 clean observation did not arrive within the allowed window." >&2
            echo "$status_json" >&2
            exit 25
          fi

          certification_json=$(curl --fail-with-body -fsS -H "$oidc_header" "${endpoint}?action=certify&smokeRunId=${smoke_run_id}")
          node -e '
            const value=JSON.parse(process.argv[1]);
            if (!value.ok || !value.certificationRunId || !value.sandboxHotelId || !value.evidenceHash) process.exit(1);
            console.log(JSON.stringify({
              smokeRunId: process.argv[2],
              certificationRunId: value.certificationRunId,
              sandboxHotelId: value.sandboxHotelId,
              sandboxRevisionId: value.sandboxRevisionId,
              evidenceHash: value.evidenceHash,
              replayed: Boolean(value.replayed)
            }, null, 2));
          ' "$certification_json" "$smoke_run_id" | tee proof-result.json

      - name: Upload non-secret proof result
        uses: actions/upload-artifact@v4
        with:
          name: disposable-p2-5-proof-${{ github.event.pull_request.head.sha }}
          path: proof-result.json
          retention-days: 1
