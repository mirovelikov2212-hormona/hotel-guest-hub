name: Massage Reminders

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: stayhub-massage-reminders
  cancel-in-progress: false

jobs:
  call-massage-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call StayHub native massage reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing."
            exit 1
          fi

          response=$(curl --fail-with-body --retry 2 --retry-delay 5 --max-time 90 -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.stayhub.app/api/cron/massage-reminders")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "$body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Massage reminder endpoint failed with HTTP $status"
            exit 1
          fi
