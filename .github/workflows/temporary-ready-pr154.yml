name: Temporary Ready PR 154

on:
  push:
    branches:
      - feat/factory-prepare-sandbox-load-acceptance
    paths:
      - ".github/workflows/temporary-ready-pr154.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  ready-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/factory-prepare-sandbox-load-acceptance
      - name: Mark exact PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 154 --repo mirovelikov2212-hormona/hotel-guest-hub
      - name: Remove this temporary workflow from the branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-ready-pr154.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cleanup: remove temporary PR readiness helper"
          git push origin HEAD:feat/factory-prepare-sandbox-load-acceptance
