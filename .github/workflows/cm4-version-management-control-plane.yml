name: CM4 Version Management Control Plane

on:
  pull_request:
    paths:
      - "lib/server/factory-production-version-management.ts"
      - "lib/server/factory-production-version-management-actions.ts"
      - "app/api/control-plane/onboarding/version-management/route.ts"
      - "app/control-plane/factory/runs/[onboardingRunId]/FactoryVersionManagementPanel.tsx"
      - "app/control-plane/factory/runs/[onboardingRunId]/page.tsx"
      - "tests/contracts/cm4-version-management-control-plane.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-cm4-version-management-control-plane.json"
      - "scripts/tenant-isolation-guard.mjs"
      - ".github/workflows/cm4-version-management-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CM4 Control Plane contract
        run: node --test tests/contracts/cm4-version-management-control-plane.contract.test.mjs
      - name: CM1-CM3 regressions
        run: |
          node --test tests/contracts/cm1-post-live-version-transition.contract.test.mjs
          node --test tests/contracts/cm1-trusted-server-integration.contract.test.mjs
          node --test tests/contracts/cm1-transition-readiness-v2.contract.test.mjs
          node --test tests/contracts/cm2-version-diff.contract.test.mjs
          node --test tests/contracts/cm3-historical-version-restore.contract.test.mjs
          node --test tests/contracts/cm3-restore-live-episode-idempotency.contract.test.mjs
      - name: Blocking tenant isolation
        run: npm run test:tenant-isolation
      - name: P2.6 release regressions
        run: |
          npm run test:p2-6-2
          npm run test:p2-6-3
          npm run test:p2-6-4
          npm run test:p2-6-5
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
