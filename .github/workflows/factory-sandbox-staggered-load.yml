name: Factory Sandbox Staggered Load Acceptance

on:
  push:
    branches:
      - feat/factory-prepare-sandbox-load-acceptance
    paths:
      - ".github/workflows/factory-sandbox-staggered-load.yml"

permissions:
  contents: read

jobs:
  load-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAYHUB_LOAD_BASE_URL: https://stayhub.app
      STAYHUB_LOAD_PREFIX: factory-load-20260901
    steps:
      - uses: actions/checkout@v4

      - name: Smoke — 2 concurrent requests
        env:
          STAYHUB_LOAD_RUN_ID: factory-load-smoke-20260901
          STAYHUB_LOAD_HOTEL_COUNT: "1"
          STAYHUB_LOAD_REQUESTS_PER_HOTEL: "2"
          STAYHUB_LOAD_WAVE_DELAY_MS: "0"
        run: |
          node scripts/factory-sandbox-staggered-load.mjs
          mv factory-sandbox-load-results.json factory-sandbox-load-smoke.json

      - name: Intermediate — 3 hotels, 5 concurrent each, one-minute waves
        env:
          STAYHUB_LOAD_RUN_ID: factory-load-intermediate-20260901
          STAYHUB_LOAD_HOTEL_COUNT: "3"
          STAYHUB_LOAD_REQUESTS_PER_HOTEL: "5"
          STAYHUB_LOAD_WAVE_DELAY_MS: "60000"
        run: |
          node scripts/factory-sandbox-staggered-load.mjs
          mv factory-sandbox-load-results.json factory-sandbox-load-intermediate.json

      - name: Full — 15 hotels, 20 concurrent each, one-minute waves
        env:
          STAYHUB_LOAD_RUN_ID: factory-load-full-20260901
          STAYHUB_LOAD_HOTEL_COUNT: "15"
          STAYHUB_LOAD_REQUESTS_PER_HOTEL: "20"
          STAYHUB_LOAD_WAVE_DELAY_MS: "60000"
        run: |
          node scripts/factory-sandbox-staggered-load.mjs
          mv factory-sandbox-load-results.json factory-sandbox-load-full.json

      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-sandbox-staggered-load-evidence
          path: factory-sandbox-load-*.json
          if-no-files-found: warn
