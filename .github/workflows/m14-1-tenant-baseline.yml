name: M14.1 Tenant Baseline Maintenance

on:
  push:
    branches:
      - "audit/m14-1-tenant-baseline-*"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout milestone branch
        uses: actions/checkout@v4
        with:
          ref: audit/m14-1-massage-runtime-projection
          fetch-depth: 0
      - name: Record exact reviewed M14.1 tenant surfaces
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("tests/contracts/tenant-isolation-baseline.json")
          data = json.loads(path.read_text())
          if data.get("expectedNeedsReview") != 45:
              raise SystemExit("unexpected prior baseline count")

          additions = [
              {
                  "filePath": "lib/server/massage-runtime-projection.ts",
                  "line": 69,
                  "table": None,
                  "tableExpression": "\"project_massage_snapshot_to_runtime\"",
                  "operation": "rpc",
                  "reasons": ["rpc_requires_review"],
                  "provenance": "service_role_exact_hotel_snapshot_lineage_projection_rpc",
              },
              {
                  "filePath": "lib/server/massage-runtime-projection.ts",
                  "line": 87,
                  "table": "massage_runtime_projection_state",
                  "tableExpression": "\"massage_runtime_projection_state\"",
                  "operation": "select",
                  "reasons": ["unclassified_table"],
                  "provenance": "server_hotel_scoped_projection_state_read",
              },
          ]
          existing = {
              (e.get("filePath"), e.get("line"), e.get("tableExpression"), e.get("operation"))
              for e in data["entries"]
          }
          for entry in additions:
              key = (entry["filePath"], entry["line"], entry["tableExpression"], entry["operation"])
              if key in existing:
                  raise SystemExit(f"review entry already exists: {key}")
              data["entries"].append(entry)

          data["expectedNeedsReview"] = 47
          data["checkpoint"] = "m14.1-massage-runtime-shadow-projection"
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
      - name: Commit reviewed tenant baseline
        run: |
          git config user.name "mirovelikov2212-hormona"
          git config user.email "miro.velikov.22.12@gmail.com"
          git add tests/contracts/tenant-isolation-baseline.json
          git diff --cached --check
          git commit -m "test(m14.1): review massage projection tenant surfaces"
          git push origin HEAD:audit/m14-1-massage-runtime-projection
