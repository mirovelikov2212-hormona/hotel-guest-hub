name: Preview Build Diagnostic

on:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - ".github/workflows/preview-build-diagnostic.yml"
      - "lib/server/supabase-admin.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build with Vercel Preview semantics
        run: npm run build
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STAYHUB_TEST_SUPABASE_URL: https://example.supabase.co
          STAYHUB_TEST_SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
