name: P1 Control Plane Foundation Gate

on:
  push:
    branches:
      - product-factory/p1-control-plane-foundation-20260816
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-control-plane-foundation-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:p1
      - run: npm test
      - run: npx eslint lib/server/control-plane-auth.ts lib/server/control-plane-registry.ts tests/contracts/p1-control-plane-foundation.contract.test.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build
