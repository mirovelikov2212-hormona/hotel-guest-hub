name: M16 Runtime Dependency Upgrade

on:
  push:
    branches:
      - audit/m16-global-scale-certification

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m16-global-scale-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install minimal non-major security upgrades
        run: npm install --save-exact next@16.3.1 @supabase/supabase-js@2.112.3 openai@6.49.0 && npm install --save-dev --save-exact eslint-config-next@16.3.1
      - name: Require zero high or critical production vulnerabilities
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit.json
          audit_status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Production audit:', JSON.stringify(counts));
          const high = Number(counts.high || 0);
          const critical = Number(counts.critical || 0);
          if (high || critical) {
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              if (item.severity === 'high' || item.severity === 'critical') {
                console.log(JSON.stringify({name, severity:item.severity, range:item.range, direct:item.isDirect, fixAvailable:item.fixAvailable}));
              }
            }
            process.exit(1);
          }
          NODE
          if [ "$audit_status" -ne 0 ]; then
            echo "npm audit returned nonzero only for lower severity findings; continuing because M16 blocker is high/critical."
          fi
      - name: Verify resolved runtime versions
        run: npm ls next @supabase/supabase-js openai ws postcss sharp nanoid
      - name: Remove one-shot workflow and commit lockfile
        run: |
          rm .github/workflows/m16-runtime-dependency-upgrade.yml
          git config user.name "stayhub-release-bot"
          git config user.email "stayhub-release-bot@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/m16-runtime-dependency-upgrade.yml
          git diff --cached --check
          git commit -m "M16: upgrade production dependencies past security advisories"
          git push origin HEAD:audit/m16-global-scale-certification
