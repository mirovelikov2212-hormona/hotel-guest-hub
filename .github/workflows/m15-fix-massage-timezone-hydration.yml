name: M15 Massage Timezone Hydration Fix

on:
  push:
    branches:
      - audit/m15-global-locales-ops-governance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m15-global-locales-ops-governance
          fetch-depth: 0
      - name: Apply exact timezone hydration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/MassageBookingSection.tsx')
          text = path.read_text()
          old_sig = '''function hydrateMassageBootstrapCache(
            hotelSlug: string,
            result: MassageBootstrapResult
          ) {'''.replace('          ', '')
          new_sig = '''function hydrateMassageBootstrapCache(
            hotelSlug: string,
            result: MassageBootstrapResult,
            hotelTimezone: string,
          ) {'''.replace('          ', '')
          if old_sig not in text:
              raise SystemExit('hydrate signature not found')
          text = text.replace(old_sig, new_sig, 1)
          if text.count('hydrateMassageBootstrapCache(hotelSlug, cached);') != 1:
              raise SystemExit('cached hydrate call mismatch')
          if text.count('hydrateMassageBootstrapCache(hotelSlug, result);') != 1:
              raise SystemExit('result hydrate call mismatch')
          text = text.replace('hydrateMassageBootstrapCache(hotelSlug, cached);', 'hydrateMassageBootstrapCache(hotelSlug, cached, hotelTimezone);', 1)
          text = text.replace('hydrateMassageBootstrapCache(hotelSlug, result);', 'hydrateMassageBootstrapCache(hotelSlug, result, hotelTimezone);', 1)
          path.write_text(text)
          PY
          rm .github/workflows/m15-fix-massage-timezone-hydration.yml
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "stayhub-release-bot"
          git config user.email "stayhub-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "M15: scope massage bootstrap cache to tenant timezone"
          git push origin HEAD:audit/m15-global-locales-ops-governance
