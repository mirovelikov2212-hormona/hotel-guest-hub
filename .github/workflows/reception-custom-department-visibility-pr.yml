name: Reception Custom Department Visibility Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'product-factory/reception-custom-department-visibility-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-factory/reception-custom-department-visibility-20260819
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded Reception visibility transform
        run: python3 scripts/reception_custom_department_visibility_once.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused Reception contract
        run: npm run test:reception-custom-department-visibility

      - name: Run full tests and tenant isolation
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

      - name: Commit only after every gate passes
        shell: bash
        run: |
          rm scripts/reception_custom_department_visibility_once.py
          rm .github/workflows/reception-custom-department-visibility-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/staff/pages/ReceptionPageContent.tsx components/staff/StaffRequestCard.tsx package.json tests/contracts/reception-custom-department-visibility.contract.test.mjs scripts/reception_custom_department_visibility_once.py .github/workflows/reception-custom-department-visibility-pr.yml
          git diff --cached --check
          git commit -m "Reception: preserve custom department visibility"
          git push origin HEAD:product-factory/reception-custom-department-visibility-20260819
