name: M11 Tenant Baseline Maintenance

on:
  push:
    branches:
      - audit/m11-release-gate-057dcad

permissions:
  contents: write

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout milestone branch
        uses: actions/checkout@v4
        with:
          ref: audit/m11-true-sandbox-config-isolation
          fetch-depth: 0
      - name: Apply reviewed baseline delta
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/contracts/tenant-isolation-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(path, 'utf8'));
          baseline.checkpoint = 'm11.1-sandbox-config-isolation';
          baseline.expectedNeedsReview = 44;
          const moved = baseline.entries.find((entry) =>
            entry.filePath === 'lib/server/config-snapshot-import.ts' &&
            entry.tableExpression === '"create_hotel_config_draft"' &&
            entry.operation === 'rpc'
          );
          if (!moved) throw new Error('Existing config snapshot RPC baseline entry not found');
          moved.line = 265;
          moved.provenance = 'authorized_internal_non_sandbox_hotel_scoped_config_draft_rpc';

          const newEntry = {
            filePath: 'lib/server/sandbox-config.ts',
            line: 56,
            table: null,
            tableExpression: '"clone_production_config_to_sandbox_draft"',
            operation: 'rpc',
            reasons: ['rpc_requires_review'],
            provenance: 'server_resolved_sandbox_exact_production_revision_service_role_clone_rpc'
          };
          if (!baseline.entries.some((entry) =>
            entry.filePath === newEntry.filePath &&
            entry.line === newEntry.line &&
            entry.tableExpression === newEntry.tableExpression &&
            entry.operation === newEntry.operation
          )) baseline.entries.splice(2, 0, newEntry);

          fs.writeFileSync(path, JSON.stringify(baseline, null, 2) + '\n');
          NODE
          git diff --check
          git diff -- tests/contracts/tenant-isolation-baseline.json
      - name: Commit reviewed baseline
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Baseline already up to date.'
            exit 0
          fi
          git config user.name 'mirovelikov2212-hormona'
          git config user.email 'miro.velikov.22.12@gmail.com'
          git add tests/contracts/tenant-isolation-baseline.json
          git commit -m 'test: review M11 tenant RPC baseline'
          git push origin HEAD:audit/m11-true-sandbox-config-isolation
