name: Temporary Dispatch Final Acceptance

on:
  push:
    branches:
      - feat/factory-prepare-sandbox-load-acceptance
    paths:
      - ".github/workflows/temporary-dispatch-final-acceptance.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final client runtime acceptance on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run factory-final-client-runtime-acceptance.yml --repo mirovelikov2212-hormona/hotel-guest-hub --ref main
