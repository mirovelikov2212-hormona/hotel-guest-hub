name: Manager UI Tweaks Gate V2

on:
  push:
    branches:
      - ui/manager-returned-survey-average-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/manager-returned-survey-average-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact Manager UI changes and regression contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('components/staff/pages/ManagerPageContent.tsx')
          source = manager.read_text()
          old = '''  const operationalRequests = useMemo(
              () => sortByTime(getOperationalAllRequests()),
              [getOperationalAllRequests],
            );'''
          new = '''  const operationalRequests = useMemo(
              () =>
                sortByTime(
                  getOperationalAllRequests().filter((request) => isOpenStatus(request.status)),
                ),
              [getOperationalAllRequests],
            );'''
          if old not in source:
              raise SystemExit('Manager operational request block not found')
          manager.write_text(source.replace(old, new, 1))

          surveys = Path('components/staff/StaffSurveyCards.tsx')
          source = surveys.read_text()
          old = '''  const copy = getCopy(lang);
            const summaries = useMemo(() => buildSurveyDaySummaries(surveys), [surveys]);
          '''
          new = '''  const copy = getCopy(lang);
            const summaries = useMemo(() => buildSurveyDaySummaries(surveys), [surveys]);
            const overallAverageRating = useMemo(
              () =>
                surveys.length
                  ? surveys.reduce((sum, survey) => sum + survey.rating, 0) / surveys.length
                  : null,
              [surveys],
            );
          '''
          if old not in source:
              raise SystemExit('Survey report summary block not found')
          source = source.replace(old, new, 1)
          old = '''        <p className="mt-2 max-w-3xl text-sm leading-6 text-white/65">{copy.reportIntro}</p>
          '''
          new = '''        {overallAverageRating !== null ? (
                  <p className="mt-2 text-base font-semibold text-white">
                    {copy.averageRating}: {overallAverageRating.toFixed(1)}/5
                  </p>
                ) : null}
                <p className="mt-2 max-w-3xl text-sm leading-6 text-white/65">{copy.reportIntro}</p>
          '''
          if old not in source:
              raise SystemExit('Survey report intro block not found')
          surveys.write_text(source.replace(old, new, 1))

          operational_test = Path('tests/contracts/operational-contracts.test.mjs')
          text = operational_test.read_text()
          if 'manager active operations exclude returned requests while preserving the returned drilldown' not in text:
              text += '''\n\ntest("manager active operations exclude returned requests while preserving the returned drilldown", async () => {
            const source = await readProjectFile("components/staff/pages/ManagerPageContent.tsx");
            assertContains(source, 'getOperationalAllRequests().filter((request) => isOpenStatus(request.status))');
            assertContains(source, 'value={summary.returnedCount}');
            assertContains(source, 'status: "returned"');
          });\n'''
              operational_test.write_text(text)

          reporting_test = Path('tests/contracts/reporting-correctness.contract.test.mjs')
          text = reporting_test.read_text()
          if 'manager survey report shows the arithmetic mean across all report surveys' not in text:
              text += '''\n\ntest("manager survey report shows the arithmetic mean across all report surveys", async () => {
            const source = await readProjectFile("components/staff/StaffSurveyCards.tsx");
            assertContains(source, "const overallAverageRating = useMemo(");
            assertContains(source, "surveys.reduce((sum, survey) => sum + survey.rating, 0) / surveys.length");
            assertContains(source, "{copy.averageRating}: {overallAverageRating.toFixed(1)}/5");
          });\n'''
              reporting_test.write_text(text)
          PY

      - run: npm ci
      - name: Full contract and tenant-isolation gate
        run: npm test
      - name: Strict lint for regression tests
        run: npx eslint tests/contracts/operational-contracts.test.mjs tests/contracts/reporting-correctness.contract.test.mjs

      - name: No new lint findings in legacy Manager components
        run: |
          set -euo pipefail
          set +e
          npx eslint components/staff/pages/ManagerPageContent.tsx components/staff/StaffSurveyCards.tsx -f json > /tmp/branch-eslint.json
          set -e

          git worktree add --detach /tmp/stayhub-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/stayhub-main/node_modules
          set +e
          (cd /tmp/stayhub-main && ./node_modules/.bin/eslint components/staff/pages/ManagerPageContent.tsx components/staff/StaffSurveyCards.tsx -f json > /tmp/main-eslint.json)
          set -e

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def findings(path):
              counts = Counter()
              for result in json.loads(Path(path).read_text() or '[]'):
                  fp = result.get('filePath', '')
                  rel = 'components/staff/pages/ManagerPageContent.tsx' if fp.endswith('/components/staff/pages/ManagerPageContent.tsx') else 'components/staff/StaffSurveyCards.tsx' if fp.endswith('/components/staff/StaffSurveyCards.tsx') else fp
                  for msg in result.get('messages', []):
                      counts[(rel, msg.get('ruleId'), int(msg.get('severity', 0)))] += 1
              return counts

          baseline = findings('/tmp/main-eslint.json')
          branch = findings('/tmp/branch-eslint.json')
          print('Main lint findings:', sum(baseline.values()))
          print('Branch lint findings:', sum(branch.values()))
          regressions = [(key, baseline.get(key, 0), count) for key, count in branch.items() if count > baseline.get(key, 0)]
          if regressions:
              for key, before, after in regressions:
                  print('NEW lint regression:', key, 'main=', before, 'branch=', after)
              raise SystemExit(1)
          print('PASS: zero new lint findings versus main.')
          PY

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build

      - name: Commit verified UI changes and remove temporary workflow
        if: ${{ success() }}
        run: |
          rm .github/workflows/manager-ui-tweaks-gate-v2.yml
          git config user.name "StayHub Audit Bot"
          git config user.email "actions@stayhub.app"
          git add components/staff/pages/ManagerPageContent.tsx components/staff/StaffSurveyCards.tsx tests/contracts/operational-contracts.test.mjs tests/contracts/reporting-correctness.contract.test.mjs .github/workflows/manager-ui-tweaks-gate-v2.yml
          git commit -m "UI: collapse returned manager requests and show survey average"
          git push origin HEAD:ui/manager-returned-survey-average-20260816
