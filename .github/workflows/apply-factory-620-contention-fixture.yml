name: Apply Factory 620 Contention Fixture Repair

on:
  push:
    branches:
      - perf/factory-guest-write-context-v1
    paths:
      - ".github/workflows/apply-factory-620-contention-fixture.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/factory-guest-write-context-v1
          fetch-depth: 0

      - name: Patch authoritative contention identities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/factory-final-620-peak.mjs")
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one replacement target, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'const identityKey = (hotel, roomIndex) => `${hotel}:${roomIndex}`;\n',
              'const identityKey = (hotel, roomIndex) => `${hotel}:${roomIndex}`;\n'
              'const contentionIdentityKey = (actorIndex) => `1:contention:${actorIndex}`;\n',
          )

          replace_once(
              '''  const add = (hotel, roomIndex) => {\n    const key = identityKey(hotel, roomIndex);\n    if (seen.has(key)) return;\n    seen.add(key);\n    specs.push({ hotel, roomIndex });\n  };\n\n  for (const hotel of group.hotels) {\n    for (let roomIndex = 1; roomIndex <= 3; roomIndex += 1) add(hotel, roomIndex);\n  }\n  if (group.hotels.includes(1)) {\n    for (let roomIndex = 1; roomIndex <= 20; roomIndex += 1) add(1, roomIndex);\n  }\n''',
              '''  const add = (hotel, roomIndex, key = identityKey(hotel, roomIndex)) => {\n    if (seen.has(key)) return;\n    seen.add(key);\n    specs.push({ hotel, roomIndex, key });\n  };\n\n  for (const hotel of group.hotels) {\n    for (let roomIndex = 1; roomIndex <= 3; roomIndex += 1) add(hotel, roomIndex);\n  }\n  if (group.hotels.includes(1)) {\n    // Contention needs 20 distinct guest devices, not 20 invented room numbers.\n    // Keep every actor on authoritative room 201 while issuing a unique device token.\n    for (let actorIndex = 1; actorIndex <= 20; actorIndex += 1) {\n      add(1, 1, contentionIdentityKey(actorIndex));\n    }\n  }\n''',
          )

          replace_once(
              'async function confirmStayIdentity(hotel, roomIndex, cellKey) {\n',
              'async function confirmStayIdentity(hotel, roomIndex, cellKey, specKey = identityKey(hotel, roomIndex)) {\n',
          )

          replace_once(
              '  const deviceToken = `${runId}:identity:h${hotel}:r${room}`;\n',
              '  const deviceToken = `${runId}:identity:${specKey}`;\n',
          )

          replace_once(
              '''    roomIndex,\n    room,\n    deviceToken,\n''',
              '''    roomIndex,\n    room,\n    identitySpecKey: specKey,\n    deviceToken,\n''',
          )

          replace_once(
              '        rows.push(await confirmStayIdentity(spec.hotel, spec.roomIndex, group.cellKey));\n',
              '        rows.push(await confirmStayIdentity(spec.hotel, spec.roomIndex, group.cellKey, spec.key));\n',
          )

          replace_once(
              '  const identityByKey = new Map(identityRows.map((row) => [identityKey(row.hotel, row.roomIndex), row]));\n',
              '  const identityByKey = new Map(identityRows.map((row) => [row.identitySpecKey, row]));\n',
          )

          replace_once(
              '''  if (group.hotels.includes(1)) {\n    for (let roomIndex = 1; roomIndex <= 20; roomIndex += 1) {\n      operations.push(\n        postOperation(\n          "massage_contention",\n          1,\n          roomIndex,\n          identityByKey.get(identityKey(1, roomIndex)),\n          contentionSlot,\n          group.cellKey,\n        ),\n      );\n    }\n  }\n''',
              '''  if (group.hotels.includes(1)) {\n    for (let actorIndex = 1; actorIndex <= 20; actorIndex += 1) {\n      operations.push(\n        postOperation(\n          "massage_contention",\n          1,\n          1,\n          identityByKey.get(contentionIdentityKey(actorIndex)),\n          contentionSlot,\n          group.cellKey,\n        ),\n      );\n    }\n  }\n''',
          )

          path.write_text(text)

          test = Path("tests/contracts/factory-final-620-contention-authority.contract.test.mjs")
          test.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\ntest("Factory 620 contention uses 20 devices on an authoritative room", async () => {\n  const source = await readFile(new URL("../../scripts/factory-final-620-peak.mjs", import.meta.url), "utf8");\n\n  assert.match(source, /const contentionIdentityKey = \(actorIndex\) => `1:contention:\$\{actorIndex\}`;/);\n  assert.match(source, /add\(1, 1, contentionIdentityKey\(actorIndex\)\);/);\n  assert.match(source, /for \(let actorIndex = 1; actorIndex <= 20; actorIndex \+= 1\)/);\n  assert.match(source, /"massage_contention",\s*1,\s*1,\s*identityByKey\.get\(contentionIdentityKey\(actorIndex\)\)/);\n  assert.doesNotMatch(source, /for \(let roomIndex = 1; roomIndex <= 20; roomIndex \+= 1\)/);\n  assert.match(source, /contentionRows\.length === 20/);\n  assert.match(source, /expectedTotalOperations: 620/);\n  assert.match(source, /contentionWinners\.length === 1 && contentionRejected\.length === 19/);\n});\n''')
          PY

      - name: Validate harness syntax and contention contract
        run: |
          node --check scripts/factory-final-620-peak.mjs
          node --test tests/contracts/factory-final-620-contention-authority.contract.test.mjs

      - name: Commit fixture repair and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-factory-620-contention-fixture.yml
          git add scripts/factory-final-620-peak.mjs tests/contracts/factory-final-620-contention-authority.contract.test.mjs
          git commit -m "Repair Factory 620 contention identities"
          git push origin HEAD:perf/factory-guest-write-context-v1
