name: Finalize Factory Survey Fast Path

on:
  push:
    branches:
      - perf/factory-guest-write-context-v1
    paths:
      - ".github/workflows/factory-direct-write-context-patch-v3.yml"

permissions:
  contents: write

jobs:
  patch-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reuse consolidated Factory room proof in Day 3 survey
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/api/guest/day3-survey/route.ts')
          text = route.read_text()
          old = '''    const roomValidation = await validateHotelRoom(hotelSlug, room);\n    timing.mark("hotel_and_room");'''
          new = '''    // A ready Factory write context has already proved the exact hotel + room\n    // through get_factory_guest_write_context_v1 and returned the canonical\n    // roomId. Reuse that proof instead of reloading hotel config solely to\n    // validate the same room a second time. Legacy/non-Factory paths remain\n    // fail-closed through validateHotelRoom.\n    const roomValidation = factoryWriteContext\n      ? {\n          ok: true as const,\n          timezone:\n            String(factoryWriteContext.runtime.hotelTimezone || hotel.timezone || "UTC").trim() ||\n            "UTC",\n        }\n      : await validateHotelRoom(hotelSlug, room);\n    timing.mark("hotel_and_room");'''
          if text.count(old) != 1:
              raise SystemExit(f'day3-survey route: expected one room-validation match, found {text.count(old)}')
          route.write_text(text.replace(old, new, 1))

          contract = Path('tests/contracts/factory-guest-write-context-wiring.contract.test.mjs')
          ctext = contract.read_text()
          marker = 'test("Factory Day 3 survey reuses consolidated room proof on the positive fast path"'
          if marker not in ctext:
              ctext += '''\n\ntest("Factory Day 3 survey reuses consolidated room proof on the positive fast path", async () => {\n  const route = await readProjectFile("app/api/guest/day3-survey/route.ts");\n\n  assertContains(route, "const roomValidation = factoryWriteContext");\n  assertContains(route, "factoryWriteContext.runtime.hotelTimezone");\n  assertContains(route, ": await validateHotelRoom(hotelSlug, room)");\n  assert.ok(\n    route.indexOf("const roomValidation = factoryWriteContext") <\n      route.indexOf('timing.mark("hotel_and_room")'),\n    "Factory room proof must be reused before hotel_and_room timing closes.",\n  );\n});\n'''
              contract.write_text(ctext)
          PY

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run focused Factory write-context contract
        run: node --test tests/contracts/factory-guest-write-context-wiring.contract.test.mjs

      - name: Run full regression suite
        run: npm test

      - name: Run production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build

      - name: Commit validated runtime change and remove temporary patch runners
        shell: bash
        run: |
          rm -f .github/workflows/factory-direct-write-context-patch.yml
          rm -f .github/workflows/factory-direct-write-context-patch-v2.yml
          rm -f .github/workflows/factory-direct-write-context-patch-v3.yml
          git config user.name "stayhub-ci"
          git config user.email "stayhub-ci@users.noreply.github.com"
          git add app/api/guest/day3-survey/route.ts \
                  tests/contracts/factory-guest-write-context-wiring.contract.test.mjs \
                  .github/workflows/factory-direct-write-context-patch.yml \
                  .github/workflows/factory-direct-write-context-patch-v2.yml \
                  .github/workflows/factory-direct-write-context-patch-v3.yml
          git diff --cached --check
          git commit -m "Reuse Factory room proof for Day 3 survey"
          git push origin HEAD:perf/factory-guest-write-context-v1
