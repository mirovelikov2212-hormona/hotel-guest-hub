name: Temporary Package Lock Security Fix

on:
  push:
    branches:
      - feat/factory-final-adversarial-acceptance

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/factory-final-adversarial-acceptance
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply lockfile-only audit fix
        run: npm audit fix --package-lock-only --audit-level=low
      - name: Verify audit is clean
        run: npm audit --audit-level=low
      - name: Commit package-lock only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already clean"
            exit 0
          fi
          git config user.name "stayhub-security-bot"
          git config user.email "stayhub-security-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update audited transitive dependency lock"
          git push origin HEAD:feat/factory-final-adversarial-acceptance
