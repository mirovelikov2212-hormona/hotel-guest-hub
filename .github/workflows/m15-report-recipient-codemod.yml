name: M15 Tenant Report Recipient Codemod

on:
  push:
    branches:
      - audit/m15-global-locales-ops-governance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m15-global-locales-ops-governance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact report recipient codemod
        run: node scripts/m15-report-recipient-codemod.mjs
      - name: Remove one-shot codemod machinery
        run: |
          rm scripts/m15-report-recipient-codemod.mjs
          rm .github/workflows/m15-report-recipient-codemod.yml
      - name: Commit patch
        run: |
          git config user.name "stayhub-release-bot"
          git config user.email "stayhub-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "M15: scope reporting recipients per tenant"
          git push origin HEAD:audit/m15-global-locales-ops-governance
