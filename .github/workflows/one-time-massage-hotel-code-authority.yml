name: One-time Massage Hotel Code Authority

on:
  push:
    branches:
      - product-factory/massage-hotel-code-authority-20260819

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-factory/massage-hotel-code-authority-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded hotel-code authority patch
        run: node scripts/one-time-massage-hotel-code-authority.mjs
      - name: Verify patch scope before tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'lib/server/massage-api-legacy.ts' 'lib/server/massage-api.ts' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected transformed file set:"
            echo "$actual"
            exit 1
          fi
      - name: Focused M14.4 contract
        run: npm run test:m14-4
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      - name: Commit validated runtime patch and remove one-time harness
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/one-time-massage-hotel-code-authority.mjs
          rm .github/workflows/one-time-massage-hotel-code-authority.yml
          git add lib/server/massage-api-legacy.ts lib/server/massage-api.ts scripts/one-time-massage-hotel-code-authority.mjs .github/workflows/one-time-massage-hotel-code-authority.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Massage: use configured hotel code for legacy writes"
          git push origin HEAD:product-factory/massage-hotel-code-authority-20260819
