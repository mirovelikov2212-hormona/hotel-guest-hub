name: Temporary Exact 4D934C2 Browser Matrix

on:
  push:
    branches:
      - feat/factory-prepare-sandbox-load-acceptance
    paths:
      - ".github/workflows/temp-dispatch-final-acceptance-a17842ad.yml"

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAYHUB_BROWSER_BASE_URL: https://www.stayhub.app
      EXPECTED_SHA: 4d934c2ab9fc6268b6253e4ed8b7df39c5bfc85b
    steps:
      - name: Checkout exact production source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Prove checked-out source SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Factory browser acceptance source SHA=$EXPECTED_SHA"
      - name: Validate browser harness syntax
        run: python -m py_compile scripts/factory-browser-device-matrix.py
      - name: Install current Playwright browser engines
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run real browser-engine and mobile-profile request matrix
        run: python scripts/factory-browser-device-matrix.py
      - name: Print browser evidence
        if: always()
        run: |
          if [ -f factory-browser-device-matrix-results.json ]; then
            cat factory-browser-device-matrix-results.json
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-4d934c2-browser-matrix-evidence
          path: factory-browser-device-matrix-results.json
          if-no-files-found: warn
