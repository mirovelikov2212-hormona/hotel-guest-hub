name: GOSTAYA Launch Test Schema Recovery

# This workflow runs only on a dedicated recovery branch. It never deploys or
# migrates Production. GitHub-hosted runners have Docker; no local installation.
on:
  push:
    branches:
      - infra/gostaya-launch-test-schema-recovery
    paths:
      - .github/workflows/gostaya-launch-test-schema-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gostaya-launch-test-schema-recovery
  cancel-in-progress: false

jobs:
  restore-test-schema:
    if: github.ref == 'refs/heads/infra/gostaya-launch-test-schema-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: gostaya-schema-recovery
    env:
      SOURCE_DB_URL: \${{ secrets.GOSTAYA_SCHEMA_SOURCE_DB_URL }}
      TEST_DB_URL: \${{ secrets.GOSTAYA_SCHEMA_TEST_DB_URL }}

    steps:
      - name: Enforce deliberate second-attempt approval
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" -lt 2 ]; then
            echo "SAFETY HOLD: First attempt does not access either database."
            echo "Configure protected environment secrets and explicitly rerun this job."
            exit 1
          fi

      - name: Validate isolated source and destination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote

          expected = {
              "SOURCE_DB_URL": "zbpwxifcsyknorpsrzbo",
              "TEST_DB_URL": "lfvfsetlatlucrirskia",
          }
          parsed = {}
          for key, project_ref in expected.items():
              value = os.environ.get(key, "")
              if not value:
                  raise SystemExit(f"Missing protected environment secret: {key}")
              url = urlsplit(value)
              host = url.hostname or ""
              user = unquote(url.username or "")
              if url.scheme not in ("postgres", "postgresql"):
                  raise SystemExit(f"{key}: not a PostgreSQL URI")
              if not (host.endswith(".supabase.co") or host.endswith(".supabase.com")):
                  raise SystemExit(f"{key}: unexpected database host")
              if project_ref not in (host + " " + user):
                  raise SystemExit(f"{key}: does not identify the expected Supabase project")
              if url.port != 5432:
                  raise SystemExit(f"{key}: use the direct or session-pooler URI on port 5432")
              parsed[key] = (host, user)
          if parsed["SOURCE_DB_URL"] == parsed["TEST_DB_URL"]:
              raise SystemExit("Source and destination cannot be the same database")
          print("PASS: allowed source and destination refs; no connection strings exposed")
          PY

      - name: Export only Production public schema, with no data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gostaya-schema"
          docker run --rm --network host \
            -e SOURCE_DB_URL \
            -v "$RUNNER_TEMP/gostaya-schema:/work" \
            postgres:17 \
            sh -ec 'pg_dump --dbname "$SOURCE_DB_URL" --schema-only --schema=public --no-owner --no-comments --file=/work/gostaya-schema.sql'
          # The target Supabase database already contains the public schema.
          sed -i '/^CREATE SCHEMA public;$/d' "$RUNNER_TEMP/gostaya-schema/gostaya-schema.sql"
          test "$(wc -c < "$RUNNER_TEMP/gostaya-schema/gostaya-schema.sql")" -gt 100000
          echo "PASS: schema-only snapshot created on ephemeral GitHub runner"

      - name: Verify clean test target before any write
        shell: bash
        run: |
          set -euo pipefail
          count="$(docker run --rm --network host -e TEST_DB_URL postgres:17 \
            sh -ec 'psql "$TEST_DB_URL" -XAt -v ON_ERROR_STOP=1 -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='\''public'\'' and c.relkind in ('\''r'\'','\''p'\'')"')"
          if [ "$count" != "0" ]; then
            echo "SAFETY STOP: test target has $count public tables; refusing to overwrite."
            exit 1
          fi
          echo "PASS: test target is empty; Production cannot be a target"

      - name: Restore schema atomically to isolated test project ONLY
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e TEST_DB_URL \
            -v "$RUNNER_TEMP/gostaya-schema:/work:ro" \
            postgres:17 \
            sh -ec 'psql "$TEST_DB_URL" -X --single-transaction -v ON_ERROR_STOP=1 --file /work/gostaya-schema.sql > /dev/null'
          echo "PASS: transactional restore completed"

      - name: Check schema parity and absence of hotel records
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gostaya-schema/signature.sql" <<'SQL'
SELECT concat_ws(':',
 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p')),
 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='v'),
 (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'),
 (SELECT count(*) FROM pg_policies WHERE schemaname='public'),
 (SELECT count(*) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT t.tgisinternal),
 (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='S'),
 (SELECT count(*) FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname='public' AND t.typtype='e')
);
SQL
          source_signature="$(docker run --rm --network host \
            -e SOURCE_DB_URL -v "$RUNNER_TEMP/gostaya-schema:/work:ro" \
            postgres:17 sh -ec 'psql "$SOURCE_DB_URL" -XAt -v ON_ERROR_STOP=1 -f /work/signature.sql')"
          test_signature="$(docker run --rm --network host \
            -e TEST_DB_URL -v "$RUNNER_TEMP/gostaya-schema:/work:ro" \
            postgres:17 sh -ec 'psql "$TEST_DB_URL" -XAt -v ON_ERROR_STOP=1 -f /work/signature.sql')"
          echo "Production public schema counts (tables:views:functions:policies:triggers:sequences:enums): $source_signature"
          echo "Isolated test public schema counts: $test_signature"
          if [ "$source_signature" != "$test_signature" ]; then
            echo "SCHEMA PARITY FAILED — no E2E tests should start."
            exit 1
          fi
          hotel_rows="$(docker run --rm --network host -e TEST_DB_URL postgres:17 \
            sh -ec 'psql "$TEST_DB_URL" -XAt -v ON_ERROR_STOP=1 -c "select count(*) from public.hotels"')"
          if [ "$hotel_rows" != "0" ]; then
            echo "DATA ISOLATION FAILED: test contains unexpected hotel records."
            exit 1
          fi
          echo "PASS: schema count parity and zero copied hotel rows"
          echo "NOTE: migration-history reconciliation and RBAC/RLS behavioral tests remain separate certification gates."
