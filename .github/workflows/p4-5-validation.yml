name: P4.5 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/control-plane/factory/**"
      - "lib/server/factory-sandbox-preflight.ts"
      - "supabase/migrations/20260818101500_p4_5_factory_sandbox_preflight_read.sql"
      - "tests/contracts/p4-5-sandbox-certification-preflight.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-p4-5-sandbox-preflight.json"
      - "scripts/tenant-isolation-guard.mjs"
      - "docs/P4.5-SANDBOX-CERTIFICATION-PREFLIGHT.md"
      - "package.json"
      - ".github/workflows/p4-5-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:p4-5
      - run: npm run test:tenant-isolation
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
