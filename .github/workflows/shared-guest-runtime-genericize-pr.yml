name: Shared Guest Runtime Genericize PR Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  genericize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product-factory/shared-guest-runtime-genericization-20260819
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded tenant-generic transform
        run: python3 scripts/run_shared_guest_runtime_genericize_once.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused contract
        run: npm run test:shared-guest-runtime

      - name: Run full tests and tenant isolation
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit only after all gates pass
        shell: bash
        run: |
          rm scripts/shared_guest_runtime_genericize_once.py
          rm scripts/run_shared_guest_runtime_genericize_once.py
          rm .github/workflows/shared-guest-runtime-genericize-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/GuestHub.tsx package.json scripts/shared_guest_runtime_genericize_once.py scripts/run_shared_guest_runtime_genericize_once.py .github/workflows/shared-guest-runtime-genericize-pr.yml
          git diff --cached --check
          git commit -m "Shared Guest runtime: remove tenant-specific GuestHub fallbacks"
          git push origin HEAD:product-factory/shared-guest-runtime-genericization-20260819
