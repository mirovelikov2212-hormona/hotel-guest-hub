name: M16 Production Closeout Docs

on:
  push:
    branches:
      - docs/m16-production-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m16-production-closeout
          fetch-depth: 0
      - name: Synchronize canonical M11-M16 closeout state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_heading_status(text, heading_prefix, status='CLOSED / COMPLETE'):
              pattern = rf'(## {re.escape(heading_prefix)}[^\n]*\n\nStatus:)\s*\*\*[^\n]*\*\*\.?'
              return re.sub(pattern, rf'\1 **{status}**.', text, count=1)

          # Roadmap: current canonical state and global contract.
          p = Path('docs/architecture/m11-m16-roadmap.md')
          t = p.read_text()
          t = replace_heading_status(t, 'M14 —')
          t = replace_heading_status(t, 'M15 —')
          t = replace_heading_status(t, 'M16 —')
          anchor = '- One codebase for all hotels; runtime authority is tenant scoped and database driven.\n'
          global_rules = (
              '- Hotel timezone is tenant data and may be any valid IANA timezone; there is no platform timezone allowlist or Sofia default.\n'
              '- Guest languages are tenant-defined canonical BCP-47 locale tags; there is no fixed six-language platform allowlist.\n'
          )
          if global_rules not in t:
              t = t.replace(anchor, anchor + global_rules, 1)
          closure = (
              '\n## M11–M16 program closure\n\n'
              'Status: **CLOSED / COMPLETE**.\n\n'
              'M11 through M16 are released to Production. Final M16 certification proves tenant-defined IANA timezones, arbitrary BCP-47 guest locales, tenant isolation, native Supabase massage authority, explicit external-adapter boundaries and a zero-high/critical production dependency audit. Production release evidence is recorded in `docs/operations/m16-global-scale-certification.md`.\n'
          )
          if '## M11–M16 program closure' not in t:
              t += closure
          p.write_text(t)

          # Execution runbook: replace obsolete six-language platform rule and publish final state.
          p = Path('docs/runbooks/StayHub_M11_M16_execution_state.md')
          t = p.read_text()
          t = t.replace(
              '- Preserve tenant isolation, Staff PIN release gate, six languages, PWA behavior and Production data.',
              '- Preserve tenant isolation, Staff PIN release gate, tenant-defined canonical BCP-47 locales, tenant-authoritative IANA timezone behavior, PWA behavior and Production data.',
          )
          for prefix in ('M14 —', 'M15 —', 'M16 —'):
              t = replace_heading_status(t, prefix)
          final_state = (
              '\n## Final M11–M16 program state\n\n'
              'Status: **CLOSED / COMPLETE**.\n\n'
              '- M15 Production merge checkpoint: `8db60026c9d0b923b8a349ba9a218d75cd3dfcbc`.\n'
              '- M16 controlled PR: #26.\n'
              '- M16 Production merge checkpoint: `62663c426512e49cfc5864a35c6a37dd3a1019ee`.\n'
              '- Exact M16 Production deployment: `dpl_Ceo38umiJyR8NLh15bAnwxW9UQkt` — `READY`.\n'
              '- M16 gates: `9/9` milestone contracts, `219/219` full contracts, tenant isolation PASS at checkpoint `m16-global-scale-certification`, production dependency audit PASS.\n'
              '- Production smoke: certification Guest Hub PASS, Aquamarine Guest Hub PASS, Aquamarine Reception Staff PIN shell PASS.\n'
              '- Certification tenant: `Pacific/Auckland`, locales `en/es/tr/ja/ar/pt-BR/zh-Hans`, native massage 22 starts, zero external massage-source rows and zero operational-history leakage.\n'
              '- Exact M16 Production deployment returned no error/warning/fatal runtime logs during closeout smoke. The project-level `url.parse()` deprecation warning predates M16 and was last attributed to an earlier deployment, so it is tracked as post-M16 cleanup rather than a release regression.\n'
          )
          if '## Final M11–M16 program state' not in t:
              t += final_state
          p.write_text(t)

          # M15 operational evidence is now a completed Production milestone.
          p = Path('docs/operations/m15-global-locales-ops-governance.md')
          t = p.read_text().replace('Status: **RELEASE CANDIDATE — Production acceptance pending**', 'Status: **CLOSED / COMPLETE**', 1)
          if '## Production closure' not in t:
              t += (
                  '\n## Production closure\n\n'
                  '- Controlled M15 merge checkpoint: `8db60026c9d0b923b8a349ba9a218d75cd3dfcbc`.\n'
                  '- Automatic Vercel Production deployment: `dpl_HwQy29pYmTKtvmVcZkaKU5aDKu7T` — `READY`.\n'
                  '- M15 Production acceptance completed before M16 certification began.\n'
              )
          p.write_text(t)

          # M16 evidence becomes the final Production closure record.
          p = Path('docs/operations/m16-global-scale-certification.md')
          t = p.read_text().replace('Status: **RELEASE CANDIDATE — Production acceptance pending**', 'Status: **CLOSED / COMPLETE**', 1)
          if '## Production closure evidence' not in t:
              t += (
                  '\n## Production closure evidence\n\n'
                  '- Controlled PR: #26 — merged with exact head protection.\n'
                  '- Production merge SHA: `62663c426512e49cfc5864a35c6a37dd3a1019ee`.\n'
                  '- Automatic Vercel Production deployment: `dpl_Ceo38umiJyR8NLh15bAnwxW9UQkt` — `READY`.\n'
                  '- Production build: Next.js 16.3.1 compile PASS, TypeScript PASS, 35/35 static pages generated.\n'
                  '- `https://www.stayhub.app/h/certification-hotel-public`: Production Guest Hub PASS.\n'
                  '- `https://aquamarine.stayhub.app`: Aquamarine Guest Hub PASS.\n'
                  '- `/staff/aquamarin/reception`: HTTP 200 and correct Reception PIN gate PASS; no PIN was submitted during smoke.\n'
                  '- Certification tenant isolation after deployment: 0 guest requests, 0 stays, 0 surveys, 0 hub events, 0 guest/staff push subscriptions and 0 staff sessions; expected 3 routing rules and 4 staff PIN records remain.\n'
                  '- Certification native massage availability after deployment: 22 starts from 10:00 through 15:15; authority `native_supabase`; external source count 0. Aquamarine authority remains `native_supabase` with its explicitly configured external adapter.\n'
                  '- Exact M16 deployment runtime log query returned no `error`, `warning` or `fatal` entries during closeout smoke.\n'
                  '- Project-level `url.parse()` deprecation is inherited from earlier deployments and is not an M16 regression; it remains post-M16 cleanup.\n'
                  '- `vercel --prod` was not used.\n'
              )
          p.write_text(t)

          # README: public canonical status.
          p = Path('README.md')
          t = p.read_text()
          t = t.replace('| M15 — Global Locales & Operations Governance | RELEASE CANDIDATE / Production acceptance pending |', '| M15 — Global Locales & Operations Governance | CLOSED / COMPLETE |')
          t = t.replace('| M16 — Final Global Multi-Hotel Certification | NEXT |', '| M16 — Final Global Multi-Hotel Certification | CLOSED / COMPLETE |')
          if '- M16 completes global-scale certification:' not in t:
              marker = '- M15 makes locale/timezone handling global, moves massage reminders to native booking authority and scopes automated report delivery per tenant.\n'
              t = t.replace(marker, marker + '- M16 completes global-scale certification: dynamic tenant locales/timezones, final isolation/security gates and exact Production smoke are closed.\n', 1)
          if '[M16 — Global Scale & Production Certification]' not in t:
              marker = '## Architecture and operational documentation\n\n'
              t = t.replace(marker, marker + '- [M16 — Global Scale & Production Certification](docs/operations/m16-global-scale-certification.md)\n', 1)
          p.write_text(t)
          PY
          rm .github/workflows/m16-production-closeout-docs.yml
          git diff --check
      - name: Commit canonical closeout
        run: |
          git config user.name "stayhub-release-bot"
          git config user.email "stayhub-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Docs: close M15 M16 and M11-M16 program"
          git push origin HEAD:docs/m16-production-closeout
