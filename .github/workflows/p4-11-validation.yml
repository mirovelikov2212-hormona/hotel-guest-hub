name: P4.11 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/control-plane/factory/runs/[onboardingRunId]/FactorySandboxCertificationPanel.tsx"
      - "app/control-plane/factory/runs/[onboardingRunId]/FactorySandboxEvidencePanel.tsx"
      - "app/control-plane/factory/runs/[onboardingRunId]/page.tsx"
      - "tests/contracts/p4-11-guided-sandbox-certification.contract.test.mjs"
      - "docs/P4.11-GUIDED-SANDBOX-CERTIFICATION-OPERATOR-FLOW.md"
      - ".github/workflows/p4-11-validation.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:p4-11
      - run: npm run test:tenant-isolation
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
