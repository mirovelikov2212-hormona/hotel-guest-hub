name: OA3 Runtime Wiring Patcher

on:
  pull_request:
    paths:
      - "scripts/oa3-wire-runtime.py"
      - ".github/workflows/oa3-runtime-wiring-patcher.yml"
  workflow_dispatch:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - "scripts/oa3-wire-runtime.py"
      - ".github/workflows/oa3-runtime-wiring-patcher.yml"

permissions:
  contents: write

jobs:
  patch-test-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic OA3 runtime wiring
        run: python scripts/oa3-wire-runtime.py
      - name: Record audited OA3 tenant-query relocation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          guard_path = Path("scripts/tenant-isolation-guard.mjs")
          guard = guard_path.read_text(encoding="utf-8")
          anchor = '  resolve(projectRoot, "tests/contracts/tenant-isolation-baseline-cm4-version-management-control-plane.json"),\n];'
          replacement = '  resolve(projectRoot, "tests/contracts/tenant-isolation-baseline-cm4-version-management-control-plane.json"),\n  resolve(projectRoot, "tests/contracts/tenant-isolation-baseline-oa3-operational-sla-escalation.json"),\n];'
          if guard.count(anchor) != 1:
              raise RuntimeError("OA3 tenant baseline anchor mismatch")
          guard_path.write_text(guard.replace(anchor, replacement, 1), encoding="utf-8")

          delta = {
              "version": 1,
              "checkpoint": "oa3-operational-sla-escalation",
              "baseCheckpoint": "cm4-version-management-control-plane",
              "expectedNeedsReview": 222,
              "removals": [],
              "relocations": [
                  {
                      "filePath": "app/api/staff/requests/route.ts",
                      "fromLine": 170,
                      "toLine": 173,
                      "table": "guest_requests",
                      "operation": "update"
                  }
              ],
              "additions": []
          }
          Path("tests/contracts/tenant-isolation-baseline-oa3-operational-sla-escalation.json").write_text(
              json.dumps(delta, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: OA3 and Operational AI contracts before commit
        run: |
          node --test tests/contracts/oa3-operational-sla-escalation.contract.test.mjs
          node --test tests/contracts/oa1-operational-workflow-resolution.contract.test.mjs
          node --test tests/contracts/oa2-operational-action-execution-bridge.contract.test.mjs
          node --test tests/contracts/oa2-clarification-action-gate.contract.test.mjs
      - name: Tenant isolation before commit
        run: npm run test:tenant-isolation
      - name: Production-style build before commit
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      - name: Commit only after tests and build pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/types.ts \
            lib/request-defs.ts \
            lib/staff/types.ts \
            app/api/guest/request-create/route.ts \
            app/api/staff/requests/route.ts \
            app/api/staff/department-runtime/requests/route.ts \
            components/staff/pages/ReceptionPageContent.tsx \
            components/staff/pages/HousekeepingPageContent.tsx \
            components/staff/pages/MaintenancePageContent.tsx \
            components/staff/pages/GenericDepartmentPageContent.tsx \
            components/staff/pages/ManagerPageContent.tsx \
            components/staff/StaffRequestCard.tsx \
            tests/contracts/oa3-operational-sla-escalation.contract.test.mjs \
            tests/contracts/tenant-isolation-baseline-oa3-operational-sla-escalation.json \
            scripts/tenant-isolation-guard.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Wire OA3 SLA policy into request runtime"
          git push origin HEAD:feat/hotel-lifecycle-v1-intelligence-review
