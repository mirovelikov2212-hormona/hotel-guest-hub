name: M10 Release Gate

on:
  push:
    branches:
      - audit/m10-5-release-gate-f58c113

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Contract and tenant tests
        run: npm test
      - name: Lint M10 changed source only
        shell: bash
        run: |
          git fetch origin 4fd9b6f08b5681597b8439e5e4e8c66f634b6cf5 --depth=1
          git fetch origin f58c113391d7d3995fa5a6d70ed56f74a97a5aa1 --depth=1
          mapfile -t changed < <(git diff --name-only 4fd9b6f08b5681597b8439e5e4e8c66f634b6cf5 f58c113391d7d3995fa5a6d70ed56f74a97a5aa1 -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.mts' '*.cjs')
          test ${#changed[@]} -gt 0
          printf 'Scoped lint files:\n%s\n' "${changed[*]}"
          npx eslint "${changed[@]}"
      - name: Production build
        run: npm run build
