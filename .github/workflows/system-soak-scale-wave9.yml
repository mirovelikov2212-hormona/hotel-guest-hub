name: System Soak and Scale Wave 9

on:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - ".github/workflows/system-soak-scale-wave9.yml"
      - "scripts/system-soak-wave9.mjs"
      - "scripts/vercel-preview-auth-preload.mjs"
      - "lib/server/hotel-scope.ts"
      - "lib/server/supabase-admin.ts"
      - "app/api/guest/stay/confirm/route.ts"
      - "app/api/guest/request-create/route.ts"
      - "app/api/guest/day3-survey/route.ts"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  id-token: write

jobs:
  soak-scale-wave-9:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STAYHUB_SYSTEM_TEST_BASE_URL: https://hotel-guest-hub-git-feat-hote-5f757d-miroslav-velikovs-projects.vercel.app
      STAYHUB_SYSTEM_TEST_PREFIX: factory-heavy-20260901
      STAYHUB_SOAK_P95_MS: "8000"
      STAYHUB_SOAK_RECOVERY_P95_MS: "5000"
      STAYHUB_SOAK_COOLDOWN_MS: "2000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate soak harness
        run: |
          node --check scripts/system-soak-wave9.mjs
          node --check scripts/vercel-preview-auth-preload.mjs

      - name: Wait for Vercel Preview on exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            for (let attempt = 1; attempt <= 40; attempt += 1) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              const vercel = data.statuses.find((status) => status.context === "Vercel");
              core.info(`Vercel attempt ${attempt}: ${vercel?.state || "pending"}`);
              if (vercel?.state === "success") return;
              if (vercel?.state === "failure" || vercel?.state === "error") {
                core.setFailed(`Vercel Preview failed for ${sha}`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed(`Timed out waiting for Vercel Preview for ${sha}`);

      - name: Mint short-lived Vercel trusted OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Run live Preview soak and scale profiles
        env:
          STAYHUB_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node --import ./scripts/vercel-preview-auth-preload.mjs scripts/system-soak-wave9.mjs

      - name: Verify Wave 9 evidence
        run: jq -e '.accepted == true and .completedAllProfiles == true' system-soak-wave9-results.json

      - name: Print concise evidence
        if: always()
        run: |
          if [ -f system-soak-wave9-results.json ]; then
            jq '{runId,baseUrl,completedAllProfiles,profiles,overall,totalObservedOperations,accepted}' system-soak-wave9-results.json
          fi

      - name: Upload Wave 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-soak-wave9-evidence
          path: system-soak-wave9-results.json
          if-no-files-found: warn
