name: M14.2 Lifecycle Review

on:
  push:
    branches:
      - "audit/m14-2-lifecycle-review-*"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M14.2 branch
        uses: actions/checkout@v4
        with:
          ref: audit/m14-2-native-massage-engine
          fetch-depth: 0
      - name: Remove stale stored lifecycle dependency
        shell: python
        run: |
          from pathlib import Path
          path = Path("supabase/migrations/20260814233000_m14_2_native_massage_engine.sql")
          text = path.read_text()
          old = '''  if v_stay.status = 'cancelled'\n    or v_stay.lifecycle_state <> 'active'\n    or v_stay.effective_check_out_at <= now()\n'''
          new = '''  -- Match the dynamic M13 write boundary. The persisted lifecycle_state is\n  -- informative and may lag a newly approved late checkout, so timestamps and\n  -- late-checkout state remain the write authority inside this atomic RPC.\n  if v_stay.status = 'cancelled'\n    or v_stay.effective_check_out_at <= now()\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected lifecycle block count")
          path.write_text(text.replace(old, new, 1))
      - name: Commit reviewed lifecycle rule
        run: |
          git config user.name "mirovelikov2212-hormona"
          git config user.email "miro.velikov.22.12@gmail.com"
          git add supabase/migrations/20260814233000_m14_2_native_massage_engine.sql
          git diff --cached --check
          git commit -m "fix(m14.2): use dynamic stay write boundary"
          git push origin HEAD:audit/m14-2-native-massage-engine
