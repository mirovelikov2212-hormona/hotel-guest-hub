name: TEMP Scanner Workflow SDK lockfile

on:
  push:
    paths:
      - ".github/workflows/tmp-scanner-workflow-sdk-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hotel-lifecycle-v1-intelligence-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate exact workflow SDK lockfile
        run: npm install workflow@4.8.8 --save-exact --package-lock-only
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(scanner-v2): add workflow sdk"
          git push origin HEAD:feat/hotel-lifecycle-v1-intelligence-review
