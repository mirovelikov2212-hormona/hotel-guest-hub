name: Temporary Factory Communications Persistence Validation

on:
  push:
    branches:
      - feature/factory-communications-persistence-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: STEP 2D communications contracts
        run: npm run test:factory-communications
      - name: Native stage contracts
        run: npm run test:factory-native-content
      - name: P2.5 sandbox contracts
        run: npm run test:p2-5
      - name: P4.11 guided certification contract
        run: npm run test:p4-11
      - name: Canonical contracts
        run: npm run test:contracts
      - name: Tenant isolation guard
        run: npm run test:tenant-isolation
      - name: Production build
        run: npm run build
