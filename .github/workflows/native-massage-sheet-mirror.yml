name: Native Massage Sheet Mirror

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-massage-sheet-mirror-production
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror confirmed native Production bookings to the Sheet adapter
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.stayhub.app/api/cron/native-massage-sheet-mirror
