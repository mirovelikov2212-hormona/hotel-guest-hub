name: Temporary Scanner Browser Dependencies Bootstrap

on:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - ".github/workflows/scanner-browser-deps-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap-browser-deps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/hotel-lifecycle-v1-intelligence-review
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned serverless browser dependencies
        run: npm install --save-exact playwright-core@1.63.0 @sparticuz/chromium@153.0.0 --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "scanner v2: add pinned browser renderer dependencies"
          git push origin HEAD:feat/hotel-lifecycle-v1-intelligence-review
