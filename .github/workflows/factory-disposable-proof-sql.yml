name: Factory Disposable Proof SQL Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260819070500_factory_disposable_onboarding_proof.sql"
      - "tests/contracts/factory-disposable-onboarding-proof.contract.test.mjs"
      - "tests/sql/factory-disposable-onboarding-proof.rehearsal.sql"
      - ".github/workflows/factory-disposable-proof-sql.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Compile migration and rehearse disposable lifecycle
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/factory-disposable-onboarding-proof.rehearsal.sql
