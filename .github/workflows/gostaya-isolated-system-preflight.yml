name: GOSTAYA Isolated System Preflight

on:
  push:
    branches:
      - infra/gostaya-launch-test-schema-recovery
    paths:
      - ".github/workflows/gostaya-isolated-system-preflight.yml"
      - "tests/contracts/m12-staff-notification-parity.contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tenant isolation
        run: npm run test:tenant-isolation
      - name: Guest, staff and manager security contracts
        run: node --test tests/contracts/api-security.contract.test.mjs tests/contracts/legacy-unscoped-staff-routes.contract.test.mjs tests/contracts/staff-pin-release-gate.contract.test.mjs

  product-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Core GOSTAYA contracts
        run: npm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-preflight-no-credentials
      SUPABASE_SERVICE_ROLE_KEY: offline-preflight-no-credentials
      STAYHUB_TEST_SUPABASE_URL: https://example.supabase.co
      STAYHUB_TEST_SUPABASE_SERVICE_ROLE_KEY: offline-preflight-no-credentials
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production-style offline build (no database access)
        run: npm run build
