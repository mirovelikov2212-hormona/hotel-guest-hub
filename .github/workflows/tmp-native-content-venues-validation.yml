name: Temporary Native Content Venues Validation

on:
  push:
    branches:
      - feature/factory-native-content-venues-model-20260826

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native content contracts
        run: node --test tests/contracts/factory-native-content-venues.contract.test.mjs tests/contracts/p4-12-runtime-config-materialization.contract.test.mjs tests/contracts/factory-standard-core-catalog.contract.test.mjs
      - name: Full contracts
        run: npm test
      - name: Build
        run: npm run build
