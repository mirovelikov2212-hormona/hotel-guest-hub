name: Patch Factory alphanumeric room input v3

on:
  push:
    branches: [fix/factory-alphanumeric-room-input-20260826]
    paths: [".github/workflows/patch-factory-alphanumeric-room-input-v3.yml"]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply generic room input patch and contract
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          guest = Path('components/GuestHub.tsx')
          source = guest.read_text()
          old_mode = 'inputMode="numeric"'
          new_mode = 'inputMode={validRoomNumbers.some((roomNumber) => /[^0-9]/.test(roomNumber)) ? "text" : "numeric"}'
          old_placeholder = 'placeholder={roomCopy.inputPlaceholder}'
          new_placeholder = 'placeholder={validRoomNumbers[0] || roomCopy.inputPlaceholder}'

          if source.count(old_mode) != 2:
              raise SystemExit(f'expected 2 numeric room input modes, found {source.count(old_mode)}')
          if source.count(old_placeholder) != 2:
              raise SystemExit(f'expected 2 room placeholders, found {source.count(old_placeholder)}')

          guest.write_text(source.replace(old_mode, new_mode).replace(old_placeholder, new_placeholder))

          contract = Path('tests/contracts/shared-guest-runtime-genericization.contract.test.mjs')
          test_source = contract.read_text()
          marker = 'Guest room confirmation adapts the mobile keyboard to tenant room inventory'
          if marker not in test_source:
              test_source += '''\n\ntest("Guest room confirmation adapts the mobile keyboard to tenant room inventory", async () => {\n  const source = await readProjectFile("components/GuestHub.tsx");\n\n  assertNotContains(source, 'inputMode="numeric"');\n  assertContains(\n    source,\n    'inputMode={validRoomNumbers.some((roomNumber) => /[^0-9]/.test(roomNumber)) ? "text" : "numeric"}',\n  );\n  assertContains(source, 'placeholder={validRoomNumbers[0] || roomCopy.inputPlaceholder}');\n});\n'''
              contract.write_text(test_source)
          PY

      - name: Run full contracts and tenant isolation
        run: npm test

      - name: Build with standard Factory release-gate environment
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

      - name: Commit validated product patch only
        run: |
          set -euo pipefail
          git config user.name "StayHub Factory Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/GuestHub.tsx tests/contracts/shared-guest-runtime-genericization.contract.test.mjs
          git diff --cached --check
          git commit -m "Support alphanumeric Factory room confirmation"
          git push origin HEAD:fix/factory-alphanumeric-room-input-20260826
