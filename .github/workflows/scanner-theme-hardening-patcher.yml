name: Scanner + Tool Theme Hardening Patcher

on:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - ".github/workflows/scanner-theme-hardening-patcher.yml"

permissions:
  contents: write

jobs:
  patch-test-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/hotel-lifecycle-v1-intelligence-review
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply scanner and base theme hardening
        run: python3 scripts/scanner-theme-hardening-patch.py

      - name: Expand one shared theme across all internal tools
        run: python3 scripts/internal-tools-theme-expansion.py

      - name: Keep permanent validation workflow unchanged in Actions commit
        run: git restore .github/workflows/hotel-lifecycle-v1-validation.yml

      - name: Scanner regression contracts
        run: >-
          node --test
          tests/contracts/hotel-scanner-coverage-crawl-plan-v1.contract.test.mjs
          tests/contracts/hotel-intelligence-value-quality-v1.contract.test.mjs
          tests/contracts/hotel-scanner-reconciliation-v1.contract.test.mjs
          tests/contracts/hotel-scanner-conflicts-v1.contract.test.mjs
          tests/contracts/hotel-scanner-public-technology-v1.contract.test.mjs
          tests/contracts/hotel-technology-discovery-v1.contract.test.mjs
          tests/contracts/hotel-scanner-professional-regressions-v1.contract.test.mjs

      - name: Shared tool theme contracts
        run: node --test tests/contracts/control-plane-tools-theme.contract.test.mjs

      - name: Blocking tenant isolation
        run: npm run test:tenant-isolation

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

      - name: Commit validated application and test patch only
        run: |
          if git diff --quiet; then
            echo "No patch changes produced"
            exit 1
          fi
          git config user.name "stayhub-ci"
          git config user.email "stayhub-ci@users.noreply.github.com"
          git add \
            lib/server/factory-hotel-scanner.ts \
            lib/server/hotel-scanner-brand-refiner.ts \
            lib/ai/hotel-intelligence-value-quality.mjs \
            lib/ai/hotel-scanner-reconciliation.mjs \
            components/internal-tools/ToolsThemeShell.tsx \
            app/control-plane/layout.tsx \
            app/hotel-factory/layout.tsx \
            app/hotel-scanner/layout.tsx \
            app/design-studio/layout.tsx \
            app/control-panel/layout.tsx \
            app/globals.css \
            tests/contracts/hotel-scanner-coverage-crawl-plan-v1.contract.test.mjs \
            tests/contracts/hotel-intelligence-value-quality-v1.contract.test.mjs \
            tests/contracts/hotel-scanner-professional-regressions-v1.contract.test.mjs \
            tests/contracts/control-plane-tools-theme.contract.test.mjs
          git commit -m "feat: harden hotel scanner and theme all internal tools"
          git push origin HEAD:feat/hotel-lifecycle-v1-intelligence-review
