name: TEMP Scanner Workflow lock repair

on:
  push:
    paths:
      - ".github/workflows/tmp-scanner-workflow-lock-repair.yml"

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hotel-lifecycle-v1-intelligence-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve dependency tree and regenerate lock
        run: npm install workflow@4.8.8 --save-exact
      - name: Prove clean install from regenerated lock
        run: |
          rm -rf node_modules
          npm ci
      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(scanner-v2): repair workflow sdk lockfile"
          git push origin HEAD:feat/hotel-lifecycle-v1-intelligence-review
