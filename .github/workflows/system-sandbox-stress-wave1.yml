name: System Sandbox Stress Wave 1

on:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - ".github/workflows/system-sandbox-stress-wave1.yml"
      - "scripts/system-sandbox-negative-probes.mjs"
      - "scripts/system-multi-hotel-load-wave1.mjs"
      - "tests/scenarios/system-operational-time-matrix.test.mjs"
      - "scripts/vercel-preview-auth-preload.mjs"
      - "lib/server/hotel-scope.ts"
      - "lib/server/supabase-admin.ts"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  id-token: write

jobs:
  sandbox-wave-1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STAYHUB_SYSTEM_TEST_BASE_URL: https://hotel-guest-hub-git-feat-hote-5f757d-miroslav-velikovs-projects.vercel.app
      STAYHUB_SYSTEM_TEST_PREFIX: factory-heavy-20260901
      STAYHUB_SYSTEM_LOAD_P95_MS: "8000"
      STAYHUB_SYSTEM_CONTROL_P95_MS: "5000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate scenario harness syntax
        run: |
          node --check scripts/system-sandbox-negative-probes.mjs
          node --check scripts/system-multi-hotel-load-wave1.mjs
          node --check scripts/vercel-preview-auth-preload.mjs

      - name: Run deterministic multi-hotel time and routing scenarios
        run: node --test tests/scenarios/system-operational-time-matrix.test.mjs

      - name: Wait for Vercel Preview on this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            for (let attempt = 1; attempt <= 40; attempt += 1) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              const vercel = data.statuses.find((status) => status.context === "Vercel");
              core.info(`Vercel attempt ${attempt}: ${vercel?.state || "pending"}`);
              if (vercel?.state === "success") return;
              if (vercel?.state === "failure" || vercel?.state === "error") {
                core.setFailed(`Vercel Preview failed for ${sha}`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed(`Timed out waiting for Vercel Preview for ${sha}`);

      - name: Mint short-lived Vercel trusted OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Run sandbox negative and tenant-isolation probes
        env:
          STAYHUB_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node --import ./scripts/vercel-preview-auth-preload.mjs scripts/system-sandbox-negative-probes.mjs

      - name: Run new multi-hotel load profiles
        env:
          STAYHUB_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node --import ./scripts/vercel-preview-auth-preload.mjs scripts/system-multi-hotel-load-wave1.mjs

      - name: Verify machine-readable acceptance evidence
        run: |
          jq -e '.accepted == true' system-sandbox-negative-probes-results.json
          jq -e '.accepted == true and .totalOperations > 0' system-multi-hotel-load-wave1-results.json

      - name: Print concise evidence
        if: always()
        run: |
          if [ -f system-sandbox-negative-probes-results.json ]; then
            jq '{runId,baseUrl,sandboxOnly,accepted,probes}' system-sandbox-negative-probes-results.json
          fi
          if [ -f system-multi-hotel-load-wave1-results.json ]; then
            jq '{runId,baseUrl,totalOperations,guardrailsMs,profileSummaries,overall,accepted}' system-multi-hotel-load-wave1-results.json
          fi

      - name: Upload Wave 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-sandbox-stress-wave1-evidence
          path: |
            system-sandbox-negative-probes-results.json
            system-multi-hotel-load-wave1-results.json
          if-no-files-found: warn
