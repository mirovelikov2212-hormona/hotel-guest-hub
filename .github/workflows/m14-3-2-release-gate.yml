name: M14.3.2 Release Gate

on:
  push:
    branches:
      - audit/m14-3-2-gate-a94ead4

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full contracts and tenant isolation
        run: npm test
      - name: Scoped ESLint
        run: npx eslint app/api/guest/massages/route.ts app/api/cron/native-massage-reconcile/route.ts lib/server/massage-native-reconciliation.ts tests/contracts/m14-3-native-staff-reconciliation.contract.test.mjs
