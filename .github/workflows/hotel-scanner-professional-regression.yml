permissions:
  contents: read

jobs:
  scanner-theme-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Scanner professional regression contracts
        run: >-
          node --test
          tests/contracts/hotel-scanner-coverage-crawl-plan-v1.contract.test.mjs
          tests/contracts/hotel-scanner-robots-v1.contract.test.mjs
          tests/contracts/hotel-intelligence-value-quality-v1.contract.test.mjs
          tests/contracts/hotel-scanner-privacy-v1.contract.test.mjs
          tests/contracts/hotel-scanner-reconciliation-v1.contract.test.mjs
          tests/contracts/hotel-scanner-conflicts-v1.contract.test.mjs
          tests/contracts/hotel-scanner-public-technology-v1.contract.test.mjs
          tests/contracts/hotel-technology-discovery-v1.contract.test.mjs
          tests/contracts/hotel-scanner-professional-regressions-v1.contract.test.mjs
          tests/contracts/hotel-scanner-verification-v2.contract.test.mjs
          tests/contracts/hotel-intelligence-professional-handoff-v2.contract.test.mjs
      - name: Shared internal tools light-dark theme contract
        run: node --test tests/contracts/control-plane-tools-theme.contract.test.mjs
      - name: Blocking tenant isolation
        run: npm run test:tenant-isolation
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
