permissions:
  contents: read

jobs:
  scanner-theme-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Scanner professional regression contracts
        run: >-
          node --test
          tests/contracts/hotel-scanner-*.contract.test.mjs
          tests/contracts/hotel-intelligence-*.contract.test.mjs
          tests/contracts/hotel-technology-discovery-v1.contract.test.mjs
      - name: Shared internal tools light-dark theme contract
        run: node --test tests/contracts/control-plane-tools-theme.contract.test.mjs
      - name: Design Studio contracts
        run: >-
          node --test
          tests/contracts/hub-design-*.contract.test.mjs
          tests/contracts/hub-experience-*.contract.test.mjs
          tests/contracts/hub-offer-*.contract.test.mjs
      - name: Factory design materialization contracts
        run: node --test tests/contracts/ds4-*.contract.test.mjs
      - name: Guest offer and private asset contracts
        run: node --test tests/contracts/ds5-*.contract.test.mjs
      - name: Manager change-management foundation contracts
        run: node --test tests/contracts/cm5-*.contract.test.mjs
      - name: Blocking tenant isolation
        run: npm run test:tenant-isolation
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
