name: Massage Hotfix Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/server/massage-native-sheet-mirror.ts"
      - "app/api/cron/native-massage-sheet-mirror/route.ts"
      - "supabase/migrations/20260904162000_harden_native_massage_mirror_safety.sql"
      - "tests/contracts/m14-3-3-production-native-authority.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-massage-mirror-safety-hotfix.json"
      - "scripts/tenant-isolation-guard.mjs"
      - ".github/workflows/massage-hotfix-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - name: Run targeted M14.3.3 contract
        id: targeted
        shell: bash
        run: |
          set +e
          node --test tests/contracts/m14-3-3-production-native-authority.contract.test.mjs > massage-hotfix-targeted.log 2>&1
          code=$?
          cat massage-hotfix-targeted.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run full npm test
        id: full
        shell: bash
        run: |
          set +e
          npm test > massage-hotfix-full.log 2>&1
          code=$?
          cat massage-hotfix-full.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > massage-hotfix-build.log 2>&1
          code=$?
          cat massage-hotfix-build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: massage-hotfix-diagnostic-${{ github.sha }}
          path: |
            massage-hotfix-targeted.log
            massage-hotfix-full.log
            massage-hotfix-build.log
          retention-days: 1
      - name: Fail on regression
        if: steps.targeted.outputs.exit_code != '0' || steps.full.outputs.exit_code != '0' || steps.build.outputs.exit_code != '0'
        run: |
          echo "targeted=${{ steps.targeted.outputs.exit_code }} full=${{ steps.full.outputs.exit_code }} build=${{ steps.build.outputs.exit_code }}"
          exit 1
