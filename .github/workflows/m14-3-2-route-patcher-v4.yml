name: M14.3.2 Route Patcher v4

on:
  push:
    branches:
      - audit/m14-3-2-route-patcher-v4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m14-3-2-native-staff-reconciliation
          fetch-depth: 0
      - name: Patch route
        run: echo '' | base64 -d | python
      - name: Validate diff
        run: git diff --check && git diff -- app/api/guest/massages/route.ts
      - name: Commit route patch only
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add app/api/guest/massages/route.ts && test "$(git diff --cached --name-only)" = 'app/api/guest/massages/route.ts' && git commit -m 'Make native staff attachment fail-safe' && git push origin HEAD:audit/m14-3-2-native-staff-reconciliation
