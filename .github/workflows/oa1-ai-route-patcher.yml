name: OA1 AI Route Patcher

on:
  push:
    paths:
      - ".oa1-payload/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feat/hotel-lifecycle-v1-intelligence-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hotel-lifecycle-v1-intelligence-review
          fetch-depth: 0
      - name: Wire deterministic OA1 plan into existing AI route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/ai/route.ts')
          text = path.read_text()

          import_line = 'import { resolveOperationalWorkflow } from "@/lib/server/operational-workflow-resolution.mjs";\n'
          import_anchor = 'import { buildAiAnswer } from "@/lib/ai/answer-builder";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('OA1 import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          resolution_block = '''    const operationalResolution = resolveOperationalWorkflow({\n      routerResult: routed,\n      catalog,\n      hotelConfig: context.config,\n      guestText: question,\n      now: new Date(),\n    });\n\n'''
          answer_anchor = '    const answer = buildAiAnswer(routed, lang, catalog);\n'
          if resolution_block not in text:
              if answer_anchor not in text:
                  raise SystemExit('OA1 answer anchor not found')
              text = text.replace(answer_anchor, resolution_block + answer_anchor, 1)

          response_anchor = '      aiPowered: engine === "openai",\n      diagnostics,\n'
          response_replacement = '      aiPowered: engine === "openai",\n      operationalAction: operationalResolution.ok ? operationalResolution.action : null,\n      operationalActionStatus: operationalResolution.status,\n      diagnostics,\n'
          if 'operationalAction: operationalResolution.ok ? operationalResolution.action : null' not in text:
              if response_anchor not in text:
                  raise SystemExit('OA1 response anchor not found')
              text = text.replace(response_anchor, response_replacement, 1)

          path.write_text(text)
          PY

          git rm -f .oa1-payload/trigger.txt
          git add app/api/ai/route.ts
          git config user.name "stayhub-automation"
          git config user.email "stayhub-automation@users.noreply.github.com"
          git commit -m "Wire OA1 deterministic workflow plan into AI route"
          git push origin HEAD:feat/hotel-lifecycle-v1-intelligence-review
