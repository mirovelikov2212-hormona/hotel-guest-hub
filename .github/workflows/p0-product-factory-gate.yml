name: P0 Product Factory Gate

on:
  push:
    branches:
      - product-factory/p0-architecture-contract-20260816
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-product-factory-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:p0
      - run: npm test
      - run: npx eslint lib/product-factory/factory-blueprint-model.mjs tests/fixtures/product-factory/p0-scenarios.mjs tests/contracts/p0-product-factory-architecture.contract.test.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build
