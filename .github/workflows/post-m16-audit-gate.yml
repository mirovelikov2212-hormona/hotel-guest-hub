name: Post-M16 System Audit Gate

on:
  push:
    branches:
      - hotfix/post-m16-system-audit-20260816
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-m16-system-audit-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full contract and tenant-isolation gate
        run: npm test
      - name: Changed-file lint
        run: npx eslint app/api/cron/massage-snapshot-sync/route.ts app/api/cron/test-data-cleanup/route.ts app/api/guest/request-create/route.ts tests/contracts/test-data-lifecycle.contract.test.mjs tests/contracts/m13-stay-read-only.contract.test.mjs tests/contracts/m15-automation-governance.contract.test.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build
