name: Temporary Factory language expansion

on:
  push:
    branches:
      - feature/factory-standard-core-v1-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/factory-standard-core-v1-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand Smart Setup language options
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/hotel-factory/new/HotelManagerOnboardingWizard.tsx')
          text = path.read_text()
          old = '''const LANGUAGES = [
            ["bg", "Български", "Bulgarian"], ["en", "Английски", "English"], ["de", "Немски", "German"],
            ["ro", "Румънски", "Romanian"], ["cs", "Чешки", "Czech"], ["ru", "Руски", "Russian"],
          ] as const;'''
          new = '''const LANGUAGES = [
            ["bg", "Български", "Bulgarian"], ["en", "English", "English"], ["de", "Deutsch", "German"],
            ["ro", "Română", "Romanian"], ["cs", "Čeština", "Czech"], ["ru", "Русский", "Russian"],
            ["pl", "Polski", "Polish"], ["tr", "Türkçe", "Turkish"], ["el", "Ελληνικά", "Greek"],
            ["es", "Español", "Spanish"], ["fr", "Français", "French"], ["it", "Italiano", "Italian"],
            ["pt", "Português", "Portuguese"], ["nl", "Nederlands", "Dutch"], ["uk", "Українська", "Ukrainian"],
            ["hu", "Magyar", "Hungarian"], ["sk", "Slovenčina", "Slovak"], ["sl", "Slovenščina", "Slovenian"],
            ["hr", "Hrvatski", "Croatian"], ["sr", "Српски", "Serbian"], ["da", "Dansk", "Danish"],
            ["sv", "Svenska", "Swedish"], ["no", "Norsk", "Norwegian"], ["fi", "Suomi", "Finnish"],
            ["he", "עברית", "Hebrew"], ["ar", "العربية", "Arabic"],
          ] as const;'''
          if old not in text:
              raise SystemExit('expected LANGUAGES block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Contract and build
        run: |
          npm ci
          node --test tests/contracts/factory-standard-core-catalog.contract.test.mjs
          npm test
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/hotel-factory/new/HotelManagerOnboardingWizard.tsx
          git commit -m "Expand Factory Smart Setup language choices"
          git push origin HEAD:feature/factory-standard-core-v1-20260826
