name: CM2 Version Change Diff

on:
  pull_request:
    paths:
      - "lib/server/factory-production-version-diff.mjs"
      - "lib/server/factory-production-version-diff.d.mts"
      - "lib/server/factory-production-version-readiness.ts"
      - "tests/contracts/cm2-version-diff.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-cm2-version-diff.json"
      - "scripts/tenant-isolation-guard.mjs"
      - ".github/workflows/cm2-version-diff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/contracts/cm2-version-diff.contract.test.mjs
      - run: npm run test:tenant-isolation
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
