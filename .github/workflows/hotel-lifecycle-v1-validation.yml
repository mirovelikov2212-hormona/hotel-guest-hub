name: Hotel Lifecycle V1 Validation

on:
  pull_request:
    paths:
      - "lib/ai/hotel-intelligence-value-quality.mjs"
      - "lib/ai/hotel-intelligence-value-quality.d.mts"
      - "lib/ai/hotel-scanner-coverage.mjs"
      - "lib/ai/hotel-scanner-coverage.d.mts"
      - "lib/ai/hotel-scanner-conflicts.mjs"
      - "lib/ai/hotel-scanner-conflicts.d.mts"
      - "lib/ai/hotel-scanner-reconciliation.mjs"
      - "lib/ai/hotel-scanner-reconciliation.d.mts"
      - "lib/ai/hotel-scanner-rich-facts.ts"
      - "lib/ai/hotel-technology-discovery.mjs"
      - "lib/ai/hotel-technology-discovery.d.mts"
      - "lib/server/hotel-scanner-crawl-plan.mjs"
      - "lib/server/hotel-scanner-crawl-plan.d.mts"
      - "lib/server/hotel-scanner-public-technology.mjs"
      - "lib/server/hotel-scanner-public-technology.d.mts"
      - "lib/server/factory-hotel-scanner.ts"
      - "app/api/control-plane/hotel-scanner/**"
      - "lib/product-factory/hotel-intelligence-review.ts"
      - "lib/server/hotel-intelligence-revisions.ts"
      - "app/api/control-plane/hotel-intelligence/**"
      - "supabase/migrations/20260907152000_hotel_intelligence_review_v1.sql"
      - "tests/contracts/hotel-scanner-public-technology-v1.contract.test.mjs"
      - "tests/contracts/hotel-technology-discovery-v1.contract.test.mjs"
      - "tests/contracts/hotel-scanner-coverage-crawl-plan-v1.contract.test.mjs"
      - "tests/contracts/hotel-scanner-coverage-v1.contract.test.mjs"
      - "tests/contracts/hotel-scanner-conflicts-v1.contract.test.mjs"
      - "tests/contracts/hotel-scanner-reconciliation-v1.contract.test.mjs"
      - "tests/contracts/hotel-intelligence-value-quality-v1.contract.test.mjs"
      - "tests/contracts/hotel-intelligence-review-v1.contract.test.mjs"
      - ".github/workflows/hotel-lifecycle-v1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hotel Scanner reconciliation contracts
        run: node --test tests/contracts/hotel-scanner-reconciliation-v1.contract.test.mjs
      - name: Hotel Intelligence value quality contracts
        run: node --test tests/contracts/hotel-intelligence-value-quality-v1.contract.test.mjs
      - name: Hotel Scanner coverage contracts
        run: node --test tests/contracts/hotel-scanner-coverage-v1.contract.test.mjs
      - name: Hotel Scanner conflict contracts
        run: node --test tests/contracts/hotel-scanner-conflicts-v1.contract.test.mjs
      - name: Hotel Scanner coverage-driven crawl plan contracts
        run: node --test tests/contracts/hotel-scanner-coverage-crawl-plan-v1.contract.test.mjs
      - name: Hotel Scanner public technology signal contracts
        run: node --test tests/contracts/hotel-scanner-public-technology-v1.contract.test.mjs
      - name: Hotel Technology discovery contracts
        run: node --test tests/contracts/hotel-technology-discovery-v1.contract.test.mjs
      - name: Hotel Intelligence review contracts
        run: node --test tests/contracts/hotel-intelligence-review-v1.contract.test.mjs
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
