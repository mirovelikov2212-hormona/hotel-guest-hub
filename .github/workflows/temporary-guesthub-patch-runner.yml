name: Temporary GuestHub Patch Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/test-room-103-stale-stay-alert-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact GuestHub patch
        run: node scripts/temporary-patch-test-room-stale-alert.mjs
      - name: Remove temporary runner files
        run: |
          rm scripts/temporary-patch-test-room-stale-alert.mjs
          rm .github/workflows/temporary-guesthub-patch-runner.yml
      - name: Verify final branch diff
        run: |
          git diff --check
          git status --short
      - name: Commit final source-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix stale test-room stay alert"
          git push origin HEAD:${{ github.head_ref }}
