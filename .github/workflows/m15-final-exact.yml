name: M15 Final Exact Gate

on:
  push:
    branches:
      - ci/m15-final-exact

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:m15
      - run: npm run test:tenant-isolation
      - run: npm run test:contracts
