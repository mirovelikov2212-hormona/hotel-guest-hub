name: Survey Problem Map Gate

on:
  push:
    branches:
      - ui/survey-problem-map-20260816
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: survey-problem-map-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx eslint components/staff/StaffSurveyCards.tsx tests/contracts/survey-problem-map.contract.test.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build
