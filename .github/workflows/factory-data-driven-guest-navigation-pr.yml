name: Factory Data-Driven Guest Navigation PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: factory-data-driven-guest-navigation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  transform-test-build:
    if: github.event.pull_request.head.ref == 'factory/data-driven-guest-service-navigation-20260820'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "factory/data-driven-guest-service-navigation-20260820"

      - name: Apply guarded data-driven Guest navigation transform
        run: python3 scripts/apply_factory_data_driven_guest_navigation_once.py

      - name: Diff integrity
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Shared Guest navigation contract
        run: npm run test:shared-guest-runtime

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

      - name: Commit only after green gates
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_factory_data_driven_guest_navigation_once.py
          git rm .github/workflows/factory-data-driven-guest-navigation-pr.yml
          git add components/GuestHub.tsx
          git add lib/guest/factory-guest-navigation.mjs
          git add lib/guest/factory-guest-navigation.d.mts
          git add lib/server/published-hotel-config.ts
          git add tests/contracts/shared-guest-runtime-genericization.contract.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Factory Guest navigation: render configured department services"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
