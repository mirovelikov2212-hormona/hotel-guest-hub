name: M16 Runtime Hardcode Audit

on:
  push:
    branches:
      - ci/m16-runtime-hardcode-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime hardcode inventory
        run: |
          echo '=== timezone / geography ==='
          rg -n --glob '!**/*.test.*' --glob '!tests/**' --glob '!docs/**' --glob '!supabase/**' 'Europe/Sofia|Sofia|Bulgaria' app components lib middleware.ts || true
          echo '=== fixed language allowlists / six-language patterns ==='
          rg -n --glob '!**/*.test.*' --glob '!tests/**' --glob '!docs/**' --glob '!supabase/**' 'SUPPORTED_[A-Z_]*LANG|SUPPORTED_GUEST_LANGS|SUPPORTED_LANGUAGES|\["bg".*,.*"en".*,.*"de".*,.*"ro".*,.*"cs".*,.*"ru"\]' app components lib middleware.ts || true
          echo '=== Aquamarine runtime identities ==='
          rg -n --glob '!**/*.test.*' --glob '!tests/**' --glob '!docs/**' --glob '!supabase/**' 'aquamarin|aquamarine|843ec551-786a-46c4-989b-9da98956cd19|05624aa0-ffcb-4f93-8cb8-a0bdc85e1962' app components lib middleware.ts || true
          echo '=== legacy locale-column authority candidates ==='
          rg -n --glob '!**/*.test.*' --glob '!tests/**' --glob '!docs/**' --glob '!supabase/**' 'name_bg|name_en|title_bg|message_bg|service_name_bg' app components lib middleware.ts || true
