name: M16 Runtime Hardcode Audit

on:
  push:
    branches:
      - ci/m16-runtime-hardcode-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime hardcode inventory
        run: |
          scan() {
            label="$1"
            pattern="$2"
            echo "=== $label ==="
            grep -RInE --exclude='*.test.*' --exclude-dir=tests --exclude-dir=docs --exclude-dir=supabase -- "$pattern" app components lib middleware.ts 2>/dev/null || true
          }
          scan 'timezone / geography' 'Europe/Sofia|Sofia|Bulgaria'
          scan 'fixed language allowlists / six-language patterns' 'SUPPORTED_[A-Z_]*LANG|SUPPORTED_GUEST_LANGS|SUPPORTED_LANGUAGES|\["bg".*,.*"en".*,.*"de".*,.*"ro".*,.*"cs".*,.*"ru"\]'
          scan 'Aquamarine runtime identities' 'aquamarin|aquamarine|843ec551-786a-46c4-989b-9da98956cd19|05624aa0-ffcb-4f93-8cb8-a0bdc85e1962'
          scan 'legacy locale-column authority candidates' 'name_bg|name_en|title_bg|message_bg|service_name_bg'
