name: Temporary Native Content Venues Persistence Validation

on:
  push:
    branches:
      - feature/factory-native-content-venues-persistence-20260826

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: STEP 2C persistence contracts
        run: node --test tests/contracts/factory-native-content-venues.contract.test.mjs tests/contracts/factory-native-content-venues-persistence.contract.test.mjs tests/contracts/p2-3-factory-operational-resources.contract.test.mjs tests/contracts/p4-12-runtime-config-materialization.contract.test.mjs
      - name: Full contracts
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
