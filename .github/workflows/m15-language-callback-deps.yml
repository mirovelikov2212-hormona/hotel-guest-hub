name: M15 Language Callback Dependencies

on:
  push:
    branches:
      - audit/m15-global-locales-ops-governance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m15-global-locales-ops-governance
          fetch-depth: 0
      - name: Apply exact dependency fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/GuestHub.tsx')
          lines = path.read_text().splitlines()
          anchors = [i for i, line in enumerate(lines) if 'language: String(safeLang),' in line]
          if len(anchors) != 1:
              raise SystemExit(f'expected one safeLang language anchor, found {len(anchors)}')
          start = anchors[0]
          matches = [i for i in range(start, min(start + 8, len(lines))) if lines[i].strip() == '}, []);']
          if len(matches) != 1:
              raise SystemExit(f'expected one callback dependency line, found {len(matches)}')
          lines[matches[0]] = '  }, [config.languageDefault, config.languages]);'
          path.write_text('\n'.join(lines) + '\n')
          PY
          rm .github/workflows/m15-language-callback-deps.yml
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "stayhub-release-bot"
          git config user.email "stayhub-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "M15: align language callback dependencies"
          git push origin HEAD:audit/m15-global-locales-ops-governance
