name: OA2 GuestHub Patch Runner

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - ".github/workflows/oa2-bootstrap-patcher.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply GuestHub OA2 wiring
        run: python scripts/oa2-patch-guesthub.py
      - name: Commit GuestHub wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/GuestHub.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Wire OA2 confirmation execution bridge"
          git push origin HEAD:feat/hotel-lifecycle-v1-intelligence-review
