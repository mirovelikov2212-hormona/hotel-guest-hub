name: Factory Cell 01 96 Probe

on:
  push:
    branches:
      - perf/factory-guest-write-context-v1
    paths:
      - ".github/workflows/factory-cell-01-96-probe.yml"
      - "scripts/factory-cell-01-96-probe.mjs"
      - "scripts/vercel-preview-auth-preload.mjs"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cell-01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAYHUB_620_BASE_URL: https://hotel-guest-k6myv655n-miroslav-velikovs-projects.vercel.app
      STAYHUB_CELL_EXPECTED_APP_SHA: 70e00e38c3f0826fa8c0af0d92955d9df0b1eff7
      STAYHUB_620_REQUEST_P95_MS: "3000"
      STAYHUB_620_SURVEY_P95_MS: "3000"
      STAYHUB_620_MASSAGE_P95_MS: "4500"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cell 01 acceptance harness
        run: |
          node --check scripts/vercel-preview-auth-preload.mjs
          node --check scripts/factory-cell-01-96-probe.mjs
          node --check scripts/factory-final-620-peak.mjs
      - name: Mint short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Run canonical Cell 01 / 96 operations
        env:
          STAYHUB_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/factory-cell-01-96-probe.mjs
      - name: Print Cell 01 evidence
        if: always()
        run: |
          if [ -f factory-cell-01-96-results.json ]; then
            jq '{schemaVersion,runId,sourceAppSha,authMode,baseUrl,cellKey,expectedTotalOperations,summary:{hotelCount:.summary.hotelCount,totalOperations:.summary.totalOperations,wallMs:.summary.wallMs,request:.summary.request,survey:.summary.survey,massageUnique:.summary.massageUnique,correctnessAccepted:.summary.correctnessAccepted,performanceAccepted:.summary.performanceAccepted,accepted:.summary.accepted},accepted,failures}' factory-cell-01-96-results.json
          fi
      - name: Upload Cell 01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-cell-01-96-evidence
          path: factory-cell-01-96-results.json
          if-no-files-found: warn
