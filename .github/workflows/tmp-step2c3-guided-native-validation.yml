name: Temporary STEP 2C.3 Guided Native Validation

on:
  push:
    branches:
      - feature/factory-guided-native-content-stage-20260826

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: STEP 2C.3 targeted contracts
        run: >-
          node --test
          tests/contracts/factory-guided-native-content-stage.contract.test.mjs
          tests/contracts/factory-native-content-venues-persistence.contract.test.mjs
          tests/contracts/factory-native-content-venues.contract.test.mjs
          tests/contracts/p4-4-guided-resource-projection-workspace.contract.test.mjs
          tests/contracts/p4-10-trusted-sandbox-certification.contract.test.mjs
          tests/contracts/p4-11-guided-sandbox-certification.contract.test.mjs
          tests/contracts/tenant-isolation-guard.contract.test.mjs
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
