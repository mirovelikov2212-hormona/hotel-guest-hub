name: CM3 Historical Version Restore

on:
  pull_request:
    paths:
      - "lib/server/factory-production-version-restore.ts"
      - "lib/server/factory-production-version-diff.mjs"
      - "lib/server/factory-production-version-readiness.ts"
      - "supabase/migrations/20260909200000_cm3_historical_version_restore_v1.sql"
      - "tests/contracts/cm3-historical-version-restore.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-cm3-historical-version-restore.json"
      - "scripts/tenant-isolation-guard.mjs"
      - ".github/workflows/cm3-historical-version-restore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CM3 historical restore contract
        run: node --test tests/contracts/cm3-historical-version-restore.contract.test.mjs
      - name: CM2 diff regression
        run: node --test tests/contracts/cm2-version-diff.contract.test.mjs
      - name: CM1 transition regression
        run: |
          node --test tests/contracts/cm1-post-live-version-transition.contract.test.mjs
          node --test tests/contracts/cm1-trusted-server-integration.contract.test.mjs
          node --test tests/contracts/cm1-transition-readiness-v2.contract.test.mjs
      - name: Blocking tenant isolation
        run: npm run test:tenant-isolation
      - name: P2.6 release regressions
        run: |
          npm run test:p2-6-2
          npm run test:p2-6-3
          npm run test:p2-6-4
          npm run test:p2-6-5
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
