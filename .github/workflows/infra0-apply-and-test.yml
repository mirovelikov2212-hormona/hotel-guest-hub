name: INFRA-0 Release Gate

on:
  push:
    branches:
      - infra/infra-0-capacity-foundation-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: infra0-build-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/infra-0-capacity-foundation-20260816
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contract tests
        run: npm test

      - name: Lint changed runtime files
        run: npx eslint app/api/staff/feed-state/route.ts app/api/staff/requests/route.ts app/api/staff/surveys/route.ts components/staff/store/StaffStoreProvider.tsx components/staff/StaffSurveyCards.tsx lib/staff/staff-feed-state-client.ts

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
