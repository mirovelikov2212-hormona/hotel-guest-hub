name: Reuse Factory Preview Supabase Env

on:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - ".github/workflows/reuse-factory-preview-supabase-env.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-preview-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_3XjEa4JGz8DWSWIW3RqauJYA
      VERCEL_PROJECT_ID: prj_KUkOL6tRgwxr0QD9tc1TVClCdf9Y
      SOURCE_BRANCH: perf/factory-guest-write-context-v1
      TARGET_BRANCH: feat/hotel-lifecycle-v1-intelligence-review
      EXPECTED_SUPABASE_HOST: zbpwxifcsyknorpsrzbo.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Verify Vercel management token is available
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN GitHub secret is not configured; cannot manage Vercel Preview env safely."
            exit 1
          fi

      - name: Reuse existing Factory Preview Supabase variables
        run: |
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const sourceBranch = process.env.SOURCE_BRANCH;
          const targetBranch = process.env.TARGET_BRANCH;
          const expectedHost = process.env.EXPECTED_SUPABASE_HOST;
          const keys = ["NEXT_PUBLIC_SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY"];

          const headers = {
            authorization: `Bearer ${token}`,
            "content-type": "application/json",
          };

          async function api(path, init = {}) {
            const response = await fetch(`https://api.vercel.com${path}`, {
              ...init,
              headers: { ...headers, ...(init.headers || {}) },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              const safeMessage =
                body?.error?.message ||
                body?.message ||
                `HTTP ${response.status}`;
              throw new Error(`Vercel API failed: ${safeMessage}`);
            }
            return body;
          }

          const sourceQuery = new URLSearchParams({
            teamId,
            gitBranch: sourceBranch,
            decrypt: "true",
            source: "vercel-cli:pull",
          });
          const source = await api(
            `/v10/projects/${projectId}/env?${sourceQuery.toString()}`,
          );
          const envs = Array.isArray(source?.envs) ? source.envs : [];

          const selected = [];
          for (const key of keys) {
            const matches = envs.filter(
              (item) =>
                item?.key === key &&
                Array.isArray(item?.target) &&
                item.target.includes("preview"),
            );
            const branchSpecific =
              matches.find((item) => item?.gitBranch === sourceBranch) ||
              matches.find((item) => !item?.gitBranch);

            if (!branchSpecific || typeof branchSpecific.value !== "string" || !branchSpecific.value) {
              throw new Error(
                `Required existing Factory Preview variable is unavailable: ${key}`,
              );
            }
            console.log(`::add-mask::${branchSpecific.value}`);
            selected.push({
              key,
              value: branchSpecific.value,
              type:
                branchSpecific.type === "plain"
                  ? "plain"
                  : branchSpecific.type === "sensitive"
                    ? "sensitive"
                    : "encrypted",
            });
          }

          const sourceUrl = selected.find(
            (item) => item.key === "NEXT_PUBLIC_SUPABASE_URL",
          )?.value;
          let sourceHost = "";
          try {
            sourceHost = new URL(sourceUrl).hostname;
          } catch {
            throw new Error("Existing Factory Preview NEXT_PUBLIC_SUPABASE_URL is invalid.");
          }

          if (sourceHost !== expectedHost) {
            throw new Error(
              `Factory Preview Supabase host mismatch: expected ${expectedHost}, found ${sourceHost}`,
            );
          }

          console.log(
            `Verified existing Factory Preview Supabase host: ${sourceHost}`,
          );

          const payload = selected.map((item) => ({
            key: item.key,
            value: item.value,
            type: item.type,
            target: ["preview"],
            gitBranch: targetBranch,
            comment: `Reused from ${sourceBranch} for GOSTAYA system sandbox certification`,
          }));

          const upsertQuery = new URLSearchParams({
            teamId,
            upsert: "true",
          });
          await api(
            `/v10/projects/${projectId}/env?${upsertQuery.toString()}`,
            {
              method: "POST",
              body: JSON.stringify(payload),
            },
          );

          const targetQuery = new URLSearchParams({
            teamId,
            gitBranch: targetBranch,
          });
          const target = await api(
            `/v10/projects/${projectId}/env?${targetQuery.toString()}`,
          );
          const targetEnvs = Array.isArray(target?.envs) ? target.envs : [];

          for (const key of keys) {
            const found = targetEnvs.some(
              (item) =>
                item?.key === key &&
                item?.gitBranch === targetBranch &&
                Array.isArray(item?.target) &&
                item.target.includes("preview"),
            );
            if (!found) {
              throw new Error(
                `Target branch Preview variable was not confirmed after upsert: ${key}`,
              );
            }
          }

          console.log(
            `Confirmed branch-specific Preview Supabase variables for ${targetBranch}; Production was not targeted.`,
          );
          NODE
