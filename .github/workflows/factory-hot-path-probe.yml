name: Factory Hot Path Probe

on:
  push:
    branches:
      - perf/factory-guest-write-context-v1
    paths:
      - ".github/workflows/factory-hot-path-probe.yml"
      - "scripts/factory-hot-path-probe.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/factory-hot-path-probe.yml"
      - "scripts/factory-hot-path-probe.mjs"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAYHUB_PROBE_BASE_URL: https://hotel-guest-6c3uxjyh6-miroslav-velikovs-projects.vercel.app
      STAYHUB_PROBE_EXPECTED_APP_SHA: 06a62726e5f71fd8dff834048158d82e69b4db39
      STAYHUB_PREVIEW_SHARE_URL: https://hotel-guest-6c3uxjyh6-miroslav-velikovs-projects.vercel.app/?_vercel_share=sCVjB8R2Op8vOVpfBTJ3OyO1hjaVPbQE
    steps:
      - uses: actions/checkout@v4
      - name: Mask temporary Preview access
        shell: bash
        run: echo "::add-mask::${STAYHUB_PREVIEW_SHARE_URL}"
      - name: Validate probe syntax
        run: node --check scripts/factory-hot-path-probe.mjs
      - name: Authenticate protected exact Preview
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location \
            --cookie-jar /tmp/vercel.cookies \
            --cookie /tmp/vercel.cookies \
            "$STAYHUB_PREVIEW_SHARE_URL" \
            --output /dev/null
          COOKIE_HEADER="$(awk 'BEGIN { first=1 } ($0 !~ /^#/ || $0 ~ /^#HttpOnly_/) && NF >= 7 { if (!first) printf "; "; printf "%s=%s", $6, $7; first=0 } END { print "" }' /tmp/vercel.cookies)"
          test -n "$COOKIE_HEADER"
          echo "::add-mask::$COOKIE_HEADER"
          echo "STAYHUB_PROBE_COOKIE=$COOKIE_HEADER" >> "$GITHUB_ENV"
      - name: Run targeted Sandbox hot-path probe
        run: node scripts/factory-hot-path-probe.mjs
      - name: Print concise evidence
        if: always()
        run: |
          if [ -f factory-hot-path-probe-results.json ]; then
            jq '{schemaVersion,runId,targetAppSha,baseUrl,startedAt,completedAt,room,hotels,totalOperations,wallMs,request,survey,massage,thresholdsMs,accepted,failures}' factory-hot-path-probe-results.json
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-hot-path-probe-evidence
          path: factory-hot-path-probe-results.json
          if-no-files-found: warn
