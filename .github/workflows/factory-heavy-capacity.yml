name: Factory Heavy Capacity Acceptance

on:
  push:
    branches:
      - feat/factory-prepare-sandbox-load-acceptance
    paths:
      - ".github/workflows/factory-heavy-capacity.yml"
      - "scripts/factory-heavy-peak.mjs"

permissions:
  contents: read

jobs:
  combined-peak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Smoke — request and survey on one Sandbox tenant
        env:
          STAYHUB_HEAVY_RUN_ID: factory-heavy-ci-smoke-20260901
          STAYHUB_HEAVY_HOTELS: "1"
          STAYHUB_HEAVY_REQUESTS_PER_HOTEL: "1"
          STAYHUB_HEAVY_SURVEYS_PER_HOTEL: "1"
        run: |
          node scripts/factory-heavy-peak.mjs
          mv factory-heavy-peak-results.json factory-heavy-smoke-results.json
      - name: Combined peak — 100 hotels, 300 requests and 200 surveys
        env:
          STAYHUB_HEAVY_RUN_ID: factory-heavy-ci-peak-20260901
          STAYHUB_HEAVY_HOTELS: "100"
          STAYHUB_HEAVY_REQUESTS_PER_HOTEL: "3"
          STAYHUB_HEAVY_SURVEYS_PER_HOTEL: "2"
        run: node scripts/factory-heavy-peak.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-heavy-capacity-evidence
          path: factory-heavy-*-results.json
          if-no-files-found: warn
