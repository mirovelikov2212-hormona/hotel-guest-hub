name: M14.3.3 Synthetic Env Build

on:
  push:
    branches:
      - audit/m14-3-3-synthetic-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: synthetic-build-only-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m14-3-3-production-native-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
