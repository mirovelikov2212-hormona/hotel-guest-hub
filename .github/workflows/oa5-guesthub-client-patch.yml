name: OA5 GuestHub Locator Patch

on:
  push:
    branches:
      - feat/hotel-lifecycle-v1-intelligence-review
    paths:
      - ".github/workflows/oa5-guesthub-client-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hotel-lifecycle-v1-intelligence-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch only the AI request locator payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("components/GuestHub.tsx")
          source = path.read_text()
          pattern = re.compile(
              r'(body:\s*JSON\.stringify\(\{\s*'
              r'question:\s*questionText,\s*'
              r'lang:\s*String\(lang\),\s*'
              r'hotelSlug:\s*config\.hotelSlug,\s*'
              r'history:\s*historyForRequest,)'
              r'(?P<tail>\s*\}\),)'
          )
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one AI payload block, found {len(matches)}")

          match = matches[0]
          history_line_start = source.rfind("\n", 0, match.end(1)) + 1
          history_indent = source[history_line_start:match.end(1)].split("history:", 1)[0]
          addition = (
              f"\n{history_indent}room,"
              f"\n{history_indent}stayId: activeStayId,"
              f"\n{history_indent}stayDeviceId,"
          )
          patched = source[:match.end(1)] + addition + source[match.end(1):]
          path.write_text(patched)
          PY
          git diff --check
          git diff -- components/GuestHub.tsx
      - name: Commit bounded GuestHub patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/GuestHub.tsx
          git commit -m "Send verified stay locators to OA5 AI context"
          git push origin HEAD:feat/hotel-lifecycle-v1-intelligence-review
