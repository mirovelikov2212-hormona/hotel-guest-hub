name: P2.6.4 Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/control-plane/onboarding/production-live-activation/**"
      - "lib/server/factory-production-live-activation.ts"
      - "lib/server/factory-production-relational-authority.ts"
      - "lib/server/published-hotel-config.ts"
      - "lib/server/guest-request-relational-ids.mjs"
      - "supabase/migrations/20260817161000_p2_6_4_production_live_activation.sql"
      - "supabase/migrations/20260825083500_p2_6_4_published_derivative_lineage_fix.sql"
      - "supabase/migrations/20260825085000_p2_6_4_public_slug_qualification_fix.sql"
      - "supabase/migrations/20260825092000_p2_6_4_relational_authority_jsonb_fix.sql"
      - "tests/contracts/p2-6-4-production-live-activation.contract.test.mjs"
      - "tests/contracts/p2-6-4-published-derivative-lineage.contract.test.mjs"
      - "tests/contracts/p2-6-4-relational-authority-jsonb.contract.test.mjs"
      - "tests/contracts/tenant-isolation-baseline-p2-6-4-production-live-activation.json"
      - "scripts/tenant-isolation-guard.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/contracts/p2-6-4-published-derivative-lineage.contract.test.mjs
      - run: node --test tests/contracts/p2-6-4-relational-authority-jsonb.contract.test.mjs
