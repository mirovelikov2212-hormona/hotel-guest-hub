name: Factory Strict Guest Runtime PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: factory-strict-guest-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  transform-test-build:
    if: github.event.pull_request.head.ref == 'factory/strict-guest-runtime-authority-20260819'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Guard exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "factory/strict-guest-runtime-authority-20260819"

      - name: Apply guarded strict Guest transform
        run: python3 scripts/apply_factory_strict_guest_runtime_once.py

      - name: Diff integrity
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Strict Guest contract
        run: npm run test:shared-guest-runtime

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit only after green gates
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_factory_strict_guest_runtime_once.py
          git rm .github/workflows/factory-strict-guest-runtime-pr.yml
          git add components/GuestHub.tsx app/api/guest/request-create/route.ts
          git add lib/guest/guest-runtime-capabilities.mjs
          git add lib/server/guest-request-authority.mjs
          git add lib/server/factory-sandbox-relational-authority.ts
          git add lib/server/published-hotel-config.ts
          git add tests/contracts/shared-guest-runtime-genericization.contract.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Factory Guest runtime: enforce strict configured authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
